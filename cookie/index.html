<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie | 个人收藏夹</title>
    <meta name="description" content="个人常用网站导航，包含价格PK、Moments、Elephant Eat Photo、数独等实用工具" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --card-bg: transparent;
            --card-hover-bg: transparent;
            --card-shadow: none;
            --border-radius: 18px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --icon-size: 30px;

            /* 亮色主题变量 */
            --bg-color: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --text-color: #181818;
            --card-bg-color: #fff;
            --card-border-color: #e0e0e5;
            --card-hover-bg-color: #f7f8fa;
            --card-hover-border-color: #bfc0c5;
            --desc-color: #222;
            --url-color: #2d2d2d;
            --divider-color: rgba(0, 0, 0, 0.1);
        }

        /* 暗色主题变量 */
        [data-theme="dark"] {
            --bg-color: #0f0f23;
            --bg-gradient: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            --text-color: #ffffff;
            --card-bg-color: #1e1e2e;
            --card-border-color: #2d2d3f;
            --card-hover-bg-color: #2a2a3e;
            --card-hover-border-color: #3d3d5f;
            --desc-color: #e0e0e0;
            --url-color: #b0b0b0;
            --divider-color: rgba(255, 255, 255, 0.1);
        }

       /* 系统主题跟随 */
       @media(prefers-color-scheme: dark) {
           :root:not([data-theme]) {
           --bg-color: #0f0f23;
           --bg-gradient: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
           --text-color: #ffffff;
           --card-bg-color: #1e1e2e;
           --card-border-color: #2d2d3f;
           --card-hover-bg-color: #2a2a3e;
           --card-hover-border-color: #3d3d5f;
           --desc-color: #e0e0e0;
           --url-color: #b0b0b0;
           --divider-color: rgba(255, 255, 255, 0.1);
           }
           }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 32px 16px;
            padding-bottom: 0;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            width: 100%;
            position: relative;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 12px;
            background: transparent;
            border: 1px solid var(--card-border-color);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .theme-toggle:hover {
            background: var(--card-hover-bg-color);
            border-color: var(--card-hover-border-color);
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover svg {
            transform: rotate(180deg);
        }

        h1 {
            font-weight: 800;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 0.02em;
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
        }

        .header-divider {
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    var(--divider-color),
                    transparent);
            margin: 8px auto 24px;
            width: 60%;
            max-width: 400px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
            width: 100%;
            max-width: 1200px;
            padding: 0 16px 30px 16px;
        }

        .nav-card {
            border-radius: 18px;
            background: var(--card-bg-color);
            border: 1.5px solid var(--card-border-color);
            box-shadow: 0 4px 16px 0 rgba(60, 60, 67, 0.08);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                background-color 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 120px;
            max-width: 600px;
        }

        .nav-card:hover {
            background: var(--card-hover-bg-color);
            box-shadow: 0 8px 32px 0 rgba(60, 60, 67, 0.13);
            border-color: var(--card-hover-border-color);
            transform: translateY(-2px) scale(1.025);
        }

        .nav-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            min-width: var(--icon-size);
            min-height: var(--icon-size);
            margin-right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: static;
            flex-shrink: 0;
            padding: 2px;
        }

        .nav-card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 8px;
            width: 100%;
            align-items: flex-start;
        }

        .nav-card-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            gap: 8px;
            margin-left: 0;
        }

        .nav-card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            margin-left: 0;
            padding-left: 0;
        }

        .nav-title {
            font-size: 1.32rem;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.01em;
            text-decoration: none;
            line-height: 1.18;
            font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
        }

        .nav-desc {
            font-size: 1.08rem;
            color: var(--desc-color);
            margin-bottom: 12px;
            line-height: 1.6;
            text-decoration: none;
            font-weight: 400;
            font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        }

        .nav-url {
            font-size: 1rem;
            color: var(--url-color);
            opacity: 0.8;
            -webkit-user-select: text;
            user-select: text;
            word-break: break-all;
            margin-top: 10px;
            text-decoration: none;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-weight: 300;
            letter-spacing: 0.01em;
        }

        .nav-card:hover .nav-url {
            opacity: 1;
        }

        .nav-card-watermark {
            position: absolute;
            top: 50%;
            right: -40px;
            transform: translateY(-50%) rotate(-15deg);
            width: 200px;
            height: 200px;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-card-watermark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 1;
            /* If it's an SVG and you want to style it, you'd need to embed it directly as <svg> */
            /* If site.base64 is indeed an SVG, consider embedding it directly and removing this CSS block */
        }

        .nav-card-watermark svg {
            /* This block is for direct SVG embed. If using <img>, it's not applicable. */
            width: 100%;
            height: 100%;
            vertical-align: middle;
            stroke: #555;
            stroke-width: 2;
            overflow: visible;
            object-fit: contain;
            opacity: 1;
        }

        .nav-card-watermark svg * {
            /* This block is for direct SVG embed. If using <img>, it's not applicable. */
            stroke: #555;
            stroke-width: 2;
        }

        .nav-card-content {
            position: relative;
            z-index: 1;
        }

        a,
        a:visited,
        a:hover,
        a:active,
        .nav-title,
        .nav-desc,
        .nav-url {
            text-decoration: none;
        }

@media(max-width: 600px) {
    body {
    padding: 24px 26px;
    }
    }
        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .nav-grid {
            gap: 18px;
            padding: 32px 16px 32px 16px;
        }

        .nav-card {
            padding: 14px 16px;
            min-height: 70px;
        }

        .nav-card-watermark {
            width: 140px;
            height: 140px;
            right: -25px;
        }

        .nav-title {
            font-size: 1.08rem;
        }

        .nav-desc {
            font-size: 0.92rem;
        }

        .nav-url {
            font-size: 0.8rem;
        }

        :root {
            --icon-size: 36px;
        }

        .nav-icon {
            margin-right: 0;
            padding: 6px;
        }

        .theme-toggle {
            position: static;
            transform: none;
            margin-left: auto;
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>Cookie 🍪</h1>
        <button class="theme-toggle" id="themeToggle">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span id="themeText">亮色</span>
        </button>
    </div>
    <div class="header-divider"></div>
    <div class="nav-grid" id="navGrid"></div>

    <script>
        // 主题管理
        class ThemeManager {
            constructor() {
                this.themes = ['light', 'dark', 'system'];
                this.currentThemeIndex = 0;
                this.themeToggle = document.getElementById('themeToggle');
                this.themeIcon = document.getElementById('themeIcon');
                this.themeText = document.getElementById('themeText');

                this.init();
            }

            init() {
                // 从 localStorage 读取保存的主题
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    this.currentThemeIndex = this.themes.indexOf(savedTheme);
                } else {
                    // 检查系统主题偏好
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        this.currentThemeIndex = 2; // system
                    }
                }

                this.applyTheme();
                this.updateButton();
                this.bindEvents();
            }

            bindEvents() {
                this.themeToggle.addEventListener('click', () => {
                    this.currentThemeIndex = (this.currentThemeIndex + 1) % this.themes.length;
                    this.applyTheme();
                    this.updateButton();
                });

                // 监听系统主题变化
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (this.themes[this.currentThemeIndex] === 'system') {
                        this.applyTheme();
                    }
                });
            }

            applyTheme() {
                const theme = this.themes[this.currentThemeIndex];
                const html = document.documentElement;

                if (theme === 'system') {
                    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    html.setAttribute('data-theme', isDark ? 'dark' : 'light');
                } else {
                    html.setAttribute('data-theme', theme);
                }

                localStorage.setItem('theme', theme);
            }

            updateButton() {
                const theme = this.themes[this.currentThemeIndex];
                const themeLabels = ['亮色', '暗色', '系统'];
                this.themeText.textContent = themeLabels[this.currentThemeIndex];

                // 更新图标
                if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)')
                        .matches)) {
                    this.themeIcon.innerHTML = `
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    `;
                } else {
                    this.themeIcon.innerHTML = `
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    `;
                }
            }
        }

        // 初始化主题管理器
        const themeManager = new ThemeManager();

        // 从 config.json 文件读取网站数据
        fetch('./config.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(sites => {
                const navGrid = document.getElementById("navGrid");
                if (!navGrid) {
                    console.error("Element with ID 'navGrid' not found.");
                    return;
                }
                sites.forEach((site) => {
                    const a = document.createElement("a");
                    a.className = "nav-card";
                    a.href = site.url;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";

                    a.innerHTML = `
                        <div class="nav-card-watermark"><img src="${site.base64}" style="width:100%;height:100%;object-fit:contain;opacity:1;" alt="Watermark Icon" /></div>
                        <div class="nav-card-content">
                            <div class="nav-card-header">
                                <div class="nav-icon"><img src="${site.base64}" style="width:var(--icon-size);height:var(--icon-size);object-fit:contain;" alt="Site Icon" /></div>
                                <div class="nav-title">${site.title}</div>
                            </div>
                            <div class="nav-card-body">
                                <div class="nav-desc">${site.desc}</div>
                                <div class="nav-url">🔗 ${getDomain(site.url)}</div>
                            </div>
                        </div>
                    `;
                    navGrid.appendChild(a);
                });
            })
            .catch(error => {
                console.error('Error loading sites data:', error);
                const navGrid = document.getElementById("navGrid");
                if (navGrid) {
                    navGrid.innerHTML = '<p>加载网站数据失败，请检查 config.json 文件是否存在或格式是否正确。</p>';
                }
            });

        function getDomain(url) {
            try {
                const parsedUrl = new URL(url);
                let domain = parsedUrl.hostname;
                // 移除开头的 www.
                domain = domain.replace(/^www\./, "");
                return domain;
            } catch (e) {
                console.error("Invalid URL:", url, e);
                return url; // Return the original URL if it's invalid
            }
        }
    </script>
</body>

</html>
