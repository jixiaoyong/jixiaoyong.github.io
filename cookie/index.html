<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie | 个人收藏夹</title>
    <meta name="description" content="个人常用网站导航，包含价格PK、Moments、Elephant Eat Photo、数独等实用工具">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: transparent;
            --card-hover-bg: transparent;
            --card-shadow: none;
            --border-radius: 18px;
            --transition: 0.2s cubic-bezier(.4, 0, .2, 1);
            --icon-size: 48px;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            /* Apple风格渐变背景 */
            background: linear-gradient(120deg, #f0f4ff 0%, #e6e9f0 40%, #f9fafc 100%);
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 32px 8px;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            width: 100%;
        }

        h1 {
            font-weight: 800;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 0.02em;
            color: #181818;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
        }

        .header-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.1), transparent);
            margin: 8px auto 24px;
            width: 60%;
            max-width: 400px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
            width: 100%;
            max-width: 1200px;
        }

        .nav-card {
            border-radius: 18px !important;
            background: #fff !important;
            border: 1.5px solid #e0e0e5 !important;
            box-shadow: 0 4px 16px 0 rgba(60, 60, 67, 0.08) !important;
            padding: 28px 24px !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            transition: box-shadow 0.2s cubic-bezier(.4, 0, .2, 1), transform 0.2s cubic-bezier(.4, 0, .2, 1), border-color 0.2s cubic-bezier(.4, 0, .2, 1);
            cursor: pointer;
            position: relative;
            overflow: visible;
            min-height: 120px;
            max-width: 600px;
        }

        .nav-card:hover {
            background: #f7f8fa !important;
            box-shadow: 0 8px 32px 0 rgba(60, 60, 67, 0.13) !important;
            border-color: #bfc0c5 !important;
            transform: translateY(-2px) scale(1.025);
        }

        .nav-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            min-width: var(--icon-size);
            min-height: var(--icon-size);
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: none;
            box-shadow: none;
            position: static;
            flex-shrink: 0;
        }

        .nav-card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 8px;
            width: 100%;
        }

        .nav-card-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            gap: 12px;
        }

        .nav-card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .nav-title {
            font-size: 1.32rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #181818;
            letter-spacing: 0.01em;
            text-decoration: none;
            line-height: 1.18;
            font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
        }

        .nav-desc {
            font-size: 1.08rem;
            color: #222;
            margin-bottom: 12px;
            line-height: 1.6;
            text-decoration: none;
            font-weight: 400;
            font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
        }

        .nav-url {
            font-size: 1.12rem !important;
            color: #2d2d2d !important;
            opacity: .8 !important;
            user-select: text;
            word-break: break-all;
            margin-top: 10px;
            text-decoration: none !important;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-weight: 500 !important;
            letter-spacing: 0.01em;
        }

        .nav-card:hover .nav-url {
            opacity: 1;
        }

        a,
        a:visited,
        a:hover,
        a:active,
        .nav-title,
        .nav-desc,
        .nav-url {
            text-decoration: none !important;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
                margin: 0;
            }

            .nav-grid {
                gap: 18px;
            }

            .nav-card {
                padding: 14px 8px;
                min-height: 70px;
            }

            .nav-title {
                font-size: 1.08rem;
            }

            .nav-desc {
                font-size: 0.92rem;
            }

            .nav-url {
                font-size: 0.8rem;
            }

            :root {
                --icon-size: 36px;
            }

            .nav-icon {
                margin-right: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>Cookie</h1>
    </div>
    <div class="header-divider"></div>
    <div class="nav-grid" id="navGrid"></div>
    <script>
        // 网站数据 JSON
        const sites = [
            {
                title: "价格PK",
                url: "https://jixiaoyong.github.io/price_pk/",
                svg: `<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect x="6" y="10" width="8" height="16" rx="2" fill="#6366F1"/><rect x="22" y="6" width="8" height="20" rx="2" fill="#38BDF8"/><path d="M10 18h16" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
                desc: "单位价格对比神器"
            },
            {
                title: "Moments",
                url: "https://xiaoyong.pages.dev/",
                svg: `<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><path d="M18 29s-9-6.5-9-13a6 6 0 0 1 12 0 6 6 0 0 1 12 0c0 6.5-9 13-9 13z" fill="#F472B6" stroke="#fff" stroke-width="2"/><circle cx="13" cy="15" r="1.5" fill="#fff"/><circle cx="23" cy="15" r="1.5" fill="#fff"/></svg>`,
                desc: "小羊和小勇的朋友圈🩷"
            },
            {
                title: "Elephant Eat Photo",
                url: "https://github.com/jixiaoyong/elephant_eat_photo",
                svg: `<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><ellipse cx="18" cy="20" rx="10" ry="8" fill="#A3E635"/><ellipse cx="18" cy="14" rx="6" ry="4" fill="#FDE68A"/><rect x="12" y="10" width="12" height="8" rx="4" fill="#F59E42"/><circle cx="24" cy="16" r="2" fill="#fff"/><rect x="16" y="24" width="4" height="6" rx="2" fill="#A3E635"/></svg>`,
                desc: "🚧 图片管理与AI识别工具"
            },
            {
                title: "数独 Sudoku",
                url: "https://jixiaoyong.github.io/sudoku/",
                svg: `<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect x="6" y="6" width="24" height="24" rx="4" fill="#FBBF24"/><path d="M18 6v24M6 18h24" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="#fff"/><circle cx="24" cy="24" r="2" fill="#fff"/></svg>`,
                desc: "在线数独游戏，支持多种玩法与难度。"
            }
        ];
        function getDomain(url) {
            try {
                return new URL(url).hostname.replace(/^www\./, '');
            } catch {
                return url;
            }
        }
        const navGrid = document.getElementById('navGrid');
        sites.forEach(site => {
            const a = document.createElement('a');
            a.className = 'nav-card';
            a.href = site.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.innerHTML = `
                <div class="nav-card-content">
                    <div class="nav-card-header">
                        <div class="nav-icon">${site.svg}</div>
                        <div class="nav-title">${site.title}</div>
                    </div>
                    <div class="nav-card-body">
                        <div class="nav-desc">${site.desc}</div>
                        <div class="nav-url">🔗 ${getDomain(site.url)}</div>
                    </div>
                </div>
            `;
            navGrid.appendChild(a);
        });
    </script>
</body>

</html>
