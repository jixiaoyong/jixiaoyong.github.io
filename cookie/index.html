<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie | 个人收藏夹</title>
    <meta
      name="description"
      content="个人常用网站导航，包含价格PK、Moments、Elephant Eat Photo、数独等实用工具"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --card-bg: transparent;
        --card-hover-bg: transparent;
        --card-shadow: none;
        --border-radius: 18px;
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --icon-size: 30px;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        /* Apple风格渐变背景 */
        background: linear-gradient(
          120deg,
          #f0f4ff 0%,
          #e6e9f0 40%,
          #f9fafc 100%
        );
        min-height: 100vh;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 32px 16px;
        padding-bottom: 0;
      }

      .header-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 24px;
        width: 100%;
      }

      h1 {
        font-weight: 800;
        font-size: 2.8rem;
        margin: 0;
        letter-spacing: 0.02em;
        color: #181818;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
      }

      .header-divider {
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 0, 0, 0.1),
          transparent
        );
        margin: 8px auto 24px;
        width: 60%;
        max-width: 400px;
      }

      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 32px;
        width: 100%;
        max-width: 1200px;
        padding: 0 16px;
      }

      .nav-card {
        border-radius: 18px !important;
        background: #fff !important;
        border: 1.5px solid #e0e0e5 !important;
        box-shadow: 0 4px 16px 0 rgba(60, 60, 67, 0.08) !important;
        padding: 28px 24px !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        transition: box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        min-height: 120px;
        max-width: 600px;
      }

      .nav-card:hover {
        background: #f7f8fa !important;
        box-shadow: 0 8px 32px 0 rgba(60, 60, 67, 0.13) !important;
        border-color: #bfc0c5 !important;
        transform: translateY(-2px) scale(1.025);
      }

      .nav-icon {
        width: var(--icon-size);
        height: var(--icon-size);
        min-width: var(--icon-size);
        min-height: var(--icon-size);
        margin-right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8fafc 0%);
        border-radius: 5px;
        position: static;
        flex-shrink: 0;
        padding: 2px;
      }

      .nav-card-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 8px;
        width: 100%;
        align-items: flex-start;
      }

      .nav-card-header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        gap: 8px;
        margin-left: 0;
      }

      .nav-card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        margin-left: 0;
        padding-left: 0;
      }

      .nav-title {
        font-size: 1.32rem;
        font-weight: 700;
        color: #181818;
        letter-spacing: 0.01em;
        text-decoration: none;
        line-height: 1.18;
        font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
      }

      .nav-desc {
        font-size: 1.08rem;
        color: #222;
        margin-bottom: 12px;
        line-height: 1.6;
        text-decoration: none;
        font-weight: 400;
        font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        margin-left: 0;
        padding-left: 0;
      }

      .nav-url {
        font-size: 1.12rem !important;
        color: #2d2d2d !important;
        opacity: 0.8 !important;
        -webkit-user-select: text;
        user-select: text;
        word-break: break-all;
        margin-top: 10px;
        text-decoration: none !important;
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-weight: 500 !important;
        letter-spacing: 0.01em;
        margin-left: 0;
        padding-left: 0;
      }

      .nav-card:hover .nav-url {
        opacity: 1;
      }

      .nav-card-watermark {
        position: absolute;
        top: 50%;
        right: -40px;
        transform: translateY(-50%) rotate(-15deg);
        width: 200px;
        height: 200px;
        opacity: 0.15;
        z-index: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-card-watermark svg {
        width: 100% !important;
        height: 100% !important;
        vertical-align: middle !important;
        stroke: #555 !important;
        stroke-width: 2 !important;
        overflow: visible !important;
        object-fit: contain !important;
        opacity: 1 !important;
      }

      .nav-card-watermark svg * {
        stroke: #555 !important;
        stroke-width: 2 !important;
      }

      .nav-card-content {
        position: relative;
        z-index: 1;
      }

      a,
      a:visited,
      a:hover,
      a:active,
      .nav-title,
      .nav-desc,
      .nav-url {
        text-decoration: none !important;
      }

      .bottom-spacer {
        height: 200px;
        width: 100%;
        min-height: 200px;
        flex-shrink: 0;
        background-color: transparent;
        border: 1px solid transparent;
      }

      @media (max-width: 600px) {
        body {
          padding: 24px 12px;
        }

        h1 {
          font-size: 1.5rem;
          margin: 0;
        }

        .nav-grid {
          gap: 18px;
          padding: 0 8px;
        }

        .nav-card {
          padding: 14px 12px;
          min-height: 70px;
        }

        .nav-card-watermark {
          width: 140px;
          height: 140px;
          right: -25px;
        }

        .nav-title {
          font-size: 1.08rem;
        }

        .nav-desc {
          font-size: 0.92rem;
        }

        .nav-url {
          font-size: 0.8rem;
        }

        :root {
          --icon-size: 36px;
        }

        .nav-icon {
          margin-right: 0;
          padding: 6px;
        }

        .bottom-spacer {
          height: 120px;
          min-height: 120px;
        }
      }
    </style>
  </head>

  <body>
    <div class="header-container">
      <h1>Cookie</h1>
    </div>
    <div class="header-divider"></div>
    <div class="nav-grid" id="navGrid"></div>
    <div class="bottom-spacer"></div>
    <script>

      const sites = [

          desc: "xiaoyang和xiaoyong的朋友圈",
        },

        {
          title: "数独 Sudoku",
          url: "https://jixiaoyong.github.io/sudoku/",
          svg: `<svg width="36" height="36" viewBox="0 0 1024 1024" fill="none" version="1.1" xmlns="http://www.w3.org/2000/svg"><rect x="170" y="170" width="684" height="684" rx="114" fill="#FBBF24" stroke="#FBBF24" stroke-width="30"/><path d="M512 170v684M170 512h684" stroke="#fff" stroke-width="57" stroke-linecap="round"/><circle cx="341" cy="341" r="57" fill="#fff" stroke="#fff" stroke-width="10"/><circle cx="683" cy="683" r="57" fill="#fff" stroke="#fff" stroke-width="10"/></svg>`,

          desc: "火车、高铁、飞机日程管理",

        {

          url: "https://github.com/jixiaoyong/elephant_eat_photo",
          svg: `<svg width="36" height="36" viewBox="0 0 1024 1024" fill="none" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M578.064871 56.839889C660.64471 59.457884 718.452597 0.273999 792.774452 0.273999S1024 283.799446 1024 314.081387c0 107.35579-112.89578 77.147849-165.161677 181.677645-33.031935 66.063871-99.095806 99.095806-115.613775 99.095806L528.516968 314.081387 578.064871 56.839889M445.935129 56.839889C363.35529 59.457884 305.547403 0.273999 231.225548 0.273999S0 283.801446 0 314.081387c0 107.35579 112.89578 77.147849 165.161677 181.677645 33.031935 66.063871 99.095806 99.095806 115.613775 99.095806l214.70958-280.773451L445.935129 56.839889" fill="#937E6D" stroke="#937E6D" stroke-width="20"/><path d="M297.289419 248.017516s-16.515968 198.193613 115.613775 264.257483V248.017516h-115.613775zM726.710581 248.017516s16.515968 198.193613-115.613775 264.257483V248.017516h115.613775z" fill="#877364" stroke="#877364" stroke-width="20"/><path d="M364.105289 721.532591c3.297994-27.217947 16.475968-78.073848 65.315872-143.193721l-49.547903-49.547903c-11.875977 26.123949-42.891916 139.661727-27.591946 193.913621 1.779997 6.319988 11.031978 5.34599 11.823977-1.171997zM645.414739 528.790967l-49.547903 49.547903c48.813905 65.083873 62.005879 115.919774 65.311873 143.149721 0.791998 6.527987 10.05998 7.503985 11.841977 1.173998 15.26997-54.267894-15.733969-167.755672-27.605947-193.871622z" fill="#FFEBD2" stroke="#FFEBD2" stroke-width="20"/><path d="M743.226548 231.501548c0-33.031935 16.515968-181.677645-231.225548-181.677645s-231.225548 148.64571-231.225548 181.677645 82.579839 33.031935 99.095806 74.321855v115.245775c0 18.415964-16.515968 107.72179-16.515968 107.721789l67.399869 67.399869c9.073982 126.345753 16.269968 337.251341 48.211906 395.049228 21.677958 39.225923 77.667848 52.883897 148.645709-16.515968 29.003943-28.357945 46.15191-60.571882 56.935889-81.72984 4.92999-9.673981 0.989998-21.435958-8.719983-26.291949-8.639983-4.317992-19.083963-1.749997-       ];
      function getDomain(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return url;
        }
      }
      const navGrid = document.getElementById("navGrid");
      sites.forEach((site) => {
        const a = document.createElement("a");
        a.className = "nav-card";
        a.href = site.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        a.innerHTML = `
                <div class="nav-card-watermark">${site.svg}</div>
                <div class="nav-card-content">
                    <div class="nav-card-header">
                        <div class="nav-icon">${site.svg}</div>
                        <div class="nav-title">${site.title}</div>
                    </div>
                    <div class="nav-card-body">
                        <div class="nav-desc">${site.desc}</div>
                        <div class="nav-url">🔗 ${getDomain(site.url)}</div>
                    </div>
                </div>
            `;
        navGrid.appendChild(a);
      });
    </script>
  </body>
</html>
