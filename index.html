<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="google-site-verification" content="tFuBeNEuu-Xgf0dYmyLsVm4CKYhb3C4SnViu88VERUI" />
  <meta name="description" content="The website of JI,XIAOYONG (A developer. A man who loves the world.)" />
  <meta name="keywords" content="jixiaoyong,blog,developer,portfolio" />
  <title>JI,XIAOYONG's Website</title>

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jixiaoyong.github.io/" />
  <meta property="og:title" content="JI,XIAOYONG's Website" />
  <meta property="og:description" content="The website of JI,XIAOYONG (A developer. A man who loves the world.)" />
  <meta property="og:image" content="https://jixiaoyong.github.io/imissyou/assets/avatar-light-transparent.webp?v=16" />

  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/webp" href="/imissyou/assets/avatar-light-transparent.webp?v=16" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- 官方系统主题切换初始化 (跟随系统、亮色、暗色) -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>

  <!-- 引入顶级艺术衬线体与高品质无衬线体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-serif: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
      --font-sans: "DM Sans", system-ui, -apple-system, sans-serif;
      --pad-x: clamp(24px, 5vw, 80px);
      --transition-base: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ==========================================================================
       亮色模式（上部透明无光斑，底下轻薄隐入内敛暗褐雾）
       ========================================================================== */
    :root, [data-theme="light"] {
      --bg: #faf7f2;
      --bg-mesh: linear-gradient(
        180deg,
        transparent 0%,
        transparent 50%,
        rgba(75, 65, 58, 0.04) 75%,
        rgba(45, 38, 33, 0.09) 100%
      );
      --text-main: #1e1a17;
      --text-muted: #4d463f;
      --accent: #c85828;

      --badge-bg: #f3ebe1;
      --badge-border: #e6dcd0;
      --badge-text: #3d352e;
      --badge-hover-bg: #ffffff;
      --badge-hover-border: #c85828;

      --card-bg: transparent;
      --card-border: transparent;
      --card-shadow: none;

      --line-color: #eae2d8;
      --toggle-bg: rgba(255, 251, 245, 0.9);
      --toggle-border: rgba(200, 88, 40, 0.15);
      --toggle-chip: rgba(255, 255, 255, 0.9);
      --accent-soft: rgba(200, 88, 40, 0.1);
      --accent-border: rgba(200, 88, 40, 0.25);

      --c0: rgba(200, 88, 40, 0.12);
      --c1: rgba(200, 88, 40, 0.35);
      --c2: rgba(200, 88, 40, 0.6);
      --c3: rgba(200, 88, 40, 0.82);
      --c4: #c85828;
    }

    /* ==========================================================================
       暗色模式
       ========================================================================== */
    [data-theme="dark"] {
      --bg: #14110e;
      --bg-mesh: linear-gradient(
        180deg,
        transparent 0%,
        transparent 50%,
        rgba(200, 88, 40, 0.07) 80%,
        rgba(200, 88, 40, 0.13) 100%
      );
      --text-main: #fafaf9;
      --text-muted: #a8a29e;
      --accent: #fb923c;

      --badge-bg: rgba(36, 28, 22, 0.85);
      --badge-border: rgba(251, 146, 60, 0.2);
      --badge-text: #fafaf9;
      --badge-hover-bg: rgba(48, 36, 28, 0.95);
      --badge-hover-border: #fb923c;

      --card-bg: transparent;
      --card-border: transparent;
      --card-shadow: none;

      --line-color: rgba(255, 255, 255, 0.1);
      --toggle-bg: rgba(28, 20, 16, 0.92);
      --toggle-border: rgba(251, 146, 60, 0.18);
      --toggle-chip: rgba(41, 32, 26, 0.9);
      --accent-soft: rgba(251, 146, 60, 0.15);
      --accent-border: rgba(251, 146, 60, 0.25);

      --c0: rgba(251, 146, 60, 0.12);
      --c1: rgba(251, 146, 60, 0.35);
      --c2: rgba(251, 146, 60, 0.6);
      --c3: rgba(251, 146, 60, 0.82);
      --c4: #fb923c;
    }

    /* ==========================================================================
       基础设置与通用图标渲染
       ========================================================================== */
    html {
      -webkit-text-size-adjust: 100%;
      color-scheme: light dark;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-sans);
      color: var(--text-main);
      background-color: var(--bg);
      transition: background-color var(--transition-base), color var(--transition-base);
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }

    .bg-mesh {
      position: fixed; inset: 0; pointer-events: none;
      z-index: -2;
      background: var(--bg-mesh);
      transition: background var(--transition-base);
    }

    /* 真实的 SVG 遮罩图标样式 */
    .icon {
      display: inline-block;
      flex-shrink: 0;
      line-height: 1;
      color: inherit;
      vertical-align: middle;
      width: 1em;
      height: 1em;
      font-size: inherit;
    }
    .icon::before {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      background-color: currentColor;
      -webkit-mask: var(--icon-src) no-repeat center / contain;
      mask: var(--icon-src) no-repeat center / contain;
    }
    .icon--md { width: 15px; height: 15px; font-size: 15px; }
    .icon--toggle { width: 16px; height: 16px; font-size: 13px; }
    .icon--pen-nib { --icon-src: url("/assets/icons/pen-nib.svg"); }
    .icon--camera { --icon-src: url("/assets/icons/camera.svg"); }
    .icon--github { --icon-src: url("/assets/icons/github.svg"); }
    .icon--envelope { --icon-src: url("/assets/icons/envelope.svg"); }
    .icon--palette { --icon-src: url("/assets/icons/palette.svg"); }
    .icon--desktop { --icon-src: url("/assets/icons/desktop.svg"); }
    .icon--sun { --icon-src: url("/assets/icons/sun.svg"); }
    .icon--moon { --icon-src: url("/assets/icons/moon.svg"); }

    /* ==========================================================================
       官方主题控制条
       ========================================================================== */
    .theme-toggle-container {
      position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
      z-index: 100; display: flex; flex-direction: column; gap: 4px;
      background: var(--toggle-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--toggle-border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transition: border-radius 0.2s ease, padding 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden; isolation: isolate;
    }
    .theme-toggle-container.collapsed {
      width: 42px; height: 42px; padding: 0;
      border-radius: 50%; justify-content: center; align-items: center;
    }
    .theme-toggle-container:not(.collapsed) {
      width: 148px; padding: 8px; border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.1);
    }
    .theme-toggle-container.collapsed .theme-toggle[data-theme] { display: none; }
    .theme-toggle-container:not(.collapsed) .theme-toggle.toggle-expand { display: none; }
    .theme-toggle-container.collapsed .theme-toggle.toggle-expand {
      display: flex; width: 42px; height: 42px; border-radius: 50%;
      justify-content: center; align-items: center; padding: 0;
    }
    .theme-toggle-container.collapsed .theme-toggle.toggle-expand span:not(.icon) { display: none; }
    .theme-toggle {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: none; border: none; color: var(--text-muted);
      padding: 9px 12px; border-radius: 10px; cursor: pointer;
      font: 500 13px/1 var(--font-sans); transition: color 0.15s, background 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .theme-toggle:hover { color: var(--text-main); background: var(--toggle-chip); }
    .theme-toggle.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

    /* ==========================================================================
       全屏布局舞台：主页面中央展示区
       ========================================================================== */
    .stage {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(40px, env(safe-area-inset-top)) var(--pad-x) max(24px, env(safe-area-inset-bottom));
      position: relative;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    .stage-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px 0;
    }

    /*
     * PC 端：右边的肖像自然靠右，挪出的空间全变成两端间的舒适留白间隙 (clamp(60px, 6vw, 96px))
     */
    .home-grid {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: clamp(60px, 6vw, 96px);
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      animation: riseIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .left-section {
      flex: 0 0 440px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      padding-bottom: 8px;
    }

    .display-title {
      font-family: var(--font-serif);
      font-size: clamp(3.8rem, 7.8vw, 6.2rem);
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -0.022em;
      color: var(--text-main);
      margin-bottom: 18px;
    }

    .display-title .accent-italic {
      font-style: italic;
      color: var(--accent);
      font-weight: 500;
      margin: 0 4px;
    }

    .tagline {
      font-size: clamp(1.15rem, 2.1vw, 1.35rem);
      font-weight: 400;
      color: var(--text-muted);
      margin-bottom: clamp(32px, 5vw, 44px);
      letter-spacing: -0.01em;
    }

    /* 4 个胶囊 Badges */
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--badge-text);
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      font-size: 15px;
      font-weight: 500;
      line-height: 1;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .badge:hover {
      color: var(--accent);
      background: var(--badge-hover-bg);
      border-color: var(--badge-hover-border);
      transform: translateY(-2px);
    }

    .contrib-wrapper {
      width: 100%;
      max-width: 440px;
      min-width: 0;
      margin-top: auto;
      padding-top: 48px;
    }

    .contrib-head {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .contrib-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      width: 100%;
    }

    .sparkline-wrap {
      position: relative;
      padding: 2px 0 0;
      border: none;
      width: 100%;
      min-width: 0;
    }

    .sparkline {
      display: flex;
      align-items: flex-end;
      gap: var(--spark-gap, 1px);
      height: var(--spark-h, 36px);
      width: 100%;
      position: relative;
      --spark-h: 36px;
      --spark-w: 2px;
      --spark-gap: 1px;
    }

    .sparkline-year-group {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: var(--spark-gap, 1px);
      flex: 1 1 0%;
      min-width: 0;
    }

    .sparkline-years {
      display: flex;
      align-items: flex-start;
      width: 100%;
      margin-top: 6px;
      gap: var(--spark-gap, 1px);
    }

    .sparkline-year {
      min-width: 0;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      opacity: 0.8;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .sparkline-year--hidden,
    .sparkline-years--decimate .sparkline-year--decimate-hide {
      visibility: hidden;
    }

    .spark {
      flex: 1 1 2px;
      min-width: 1px;
      max-width: 4px;
      border-radius: 1px 1px 0 0;
      background: var(--c0);
      border: none;
      transition: height 0.3s ease, background 0.2s, opacity 0.2s;
      cursor: default;
      touch-action: manipulation;
    }

    .spark:focus-visible {
      outline: 1px solid var(--accent-border);
      outline-offset: 1px;
    }

    .spark-tip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 6px);
      transform: translateX(-50%) translateY(4px);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      background: var(--toggle-bg);
      color: var(--text-main);
      border: 1px solid var(--toggle-border);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    .spark-tip.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .spark[data-l="0"] { height: 2px !important; opacity: 0.35; }
    .spark[data-l="1"] { background: var(--c1); }
    .spark[data-l="2"] { background: var(--c2); }
    .spark[data-l="3"] { background: var(--c3); }
    .spark[data-l="4"] { background: var(--c4); }

    /* ==========================================================================
       右侧：3D 人像
       1) PC桌面版大小精确恢复并克制优化（max-width: 500px, max-height: 680px，绝不会占满全屏高度）；
       2) 肖像自然向右偏移置放，让空间充当其与左侧内容的间隙；
       3) 仅最后约 1/4 ~ 1/3 (75%~99%) 处向下平润虚进。
       ========================================================================== */
    .right-section {
      display: flex;
      justify-content: flex-end; /* PC 肖像朝向右侧停靠 */
      align-items: flex-end;
      position: relative;
      flex: 1 1 auto;
    }

    .avatar-3d-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px; /* 精巧收复此前最完美优雅的杂志构图上限 */
      display: flex;
      justify-content: flex-end;
    }

    .avatar-3d-img {
      width: 100%;
      height: auto;
      max-height: 680px; /* 严格锁顶在 680px，彻底告别“快有屏幕那么高” */
      object-fit: contain;
      display: block;
      border: none !important;
      outline: none !important;
      background: transparent !important;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 99%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 99%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .avatar-3d-wrapper:hover .avatar-3d-img {
      transform: translateY(-5px);
    }

    /* ==========================================================================
       页脚 Colophon
       ========================================================================== */
    .colophon {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding-top: 22px;
      border-top: 1px solid var(--line-color);
    }

    .colophon-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .colophon-tag {
      display: inline-flex; align-items: center; gap: 6px;
    }

    .colophon-mark {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
    }

    .colophon-url { color: var(--text-muted); }
    .colophon-host { color: var(--accent); font-weight: 700; }
    .colophon-tld { color: var(--text-muted); opacity: 0.75; }

    .colophon-copy {
      margin-top: 8px; font-size: 11px; color: var(--text-muted); opacity: 0.75;
    }

    /* ==========================================================================
       移动端响应式处理（肖像为原来 0.75 倍，240px 上限，手机上精致轻灵）
       ========================================================================== */
    @media (max-width: 860px) {
      .home-grid {
        flex-direction: column;
        gap: 24px;
        text-align: center;
        width: 100%;
      }
      .right-section {
        order: -1;
        margin-bottom: 4px;
        justify-content: center;
      }
      .left-section {
        order: 1;
        align-items: center;
        width: 100%;
        flex: 1 1 auto;
      }
      .badge-row {
        justify-content: center;
        margin-bottom: 48px;
      }
      .contrib-wrapper {
        width: 100%;
        max-width: 100%;
        margin-top: 16px;
        padding-top: 0;
      }
      .colophon {
        width: 100%;
        max-width: 100%;
        text-align: center;
      }
      .colophon-row {
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .colophon-copy {
        text-align: center;
        margin: 10px auto 0;
      }
      .avatar-3d-wrapper {
        max-width: 240px;
        margin: 0 auto;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .home-grid, .avatar-3d-img { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"></div>

  <!-- 顶部原生主题选择组件：支持折叠/展开、自动、亮色、暗色 -->
  <div class="theme-toggle-container collapsed">
    <button type="button" class="theme-toggle toggle-expand" aria-label="主题设置">
      <span class="icon icon--toggle icon--palette" aria-hidden="true"></span>
      <span>主题</span>
    </button>
    <button type="button" class="theme-toggle" data-theme="system" aria-label="跟随系统">
      <span class="icon icon--toggle icon--desktop" aria-hidden="true"></span>
      <span>系统</span>
    </button>
    <button type="button" class="theme-toggle" data-theme="light" aria-label="暖雾亮色">
      <span class="icon icon--toggle icon--sun" aria-hidden="true"></span>
      <span>亮色</span>
    </button>
    <button type="button" class="theme-toggle" data-theme="dark" aria-label="暖夜暗色">
      <span class="icon icon--toggle icon--moon" aria-hidden="true"></span>
      <span>暗色</span>
    </button>
  </div>

  <!-- 中心界面层 -->
  <main class="stage">
    <div class="stage-main">
      <div class="home-grid">

        <!-- 左侧文本展示 -->
        <div class="left-section">
          <div>
            <h1 class="display-title">
              JI, <span class="accent-italic">Xiao</span>Yong
            </h1>
            <p class="tagline">Stay hungry. Stay foolish.</p>

            <!-- 4 个胶囊 Badges -->
            <nav class="badge-row" aria-label="站点导航">
              <a class="badge" href="https://jixiaoyong.github.io/blog/" target="_blank" rel="noopener">
                <span class="icon icon--md icon--pen-nib" aria-hidden="true"></span>
                <span>Blog</span>
              </a>
              <a class="badge" href="https://xiaoyong.pages.dev/" target="_blank" rel="noopener">
                <span class="icon icon--md icon--camera" aria-hidden="true"></span>
                <span>Moments</span>
              </a>
              <a class="badge" href="https://github.com/jixiaoyong" target="_blank" rel="noopener">
                <span class="icon icon--md icon--github" aria-hidden="true"></span>
                <span>GitHub</span>
              </a>
              <a class="badge" href="mailto:jixiaoyong1995@gmail.com">
                <span class="icon icon--md icon--envelope" aria-hidden="true"></span>
                <span>Email</span>
              </a>
            </nav>
          </div>

          <!-- GitHub Contributions 区域：margin-top: auto 沉稳压底，与右侧3D人像根部水平线100%齐平 -->
          <div class="contrib-wrapper">
            <div class="contrib-head"><span>GITHUB CONTRIBUTIONS</span></div>
            <div class="contrib-card">
              <section class="contrib" id="github-contrib" aria-label="GitHub contributions">
                <div class="sparkline-wrap">
                  <div class="sparkline" id="sparkline"></div>
                </div>
              </section>
            </div>
          </div>
        </div>

        <!-- 右侧 3D 肖像区 -->
