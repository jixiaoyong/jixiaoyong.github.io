  <body>
    <!-- 主题切换按钮 -->

    <script>
      // Cookie 工具函数
      function setCookie(name, value, days = 365) {
        const expires = new Date();
        expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
        document.cookie = `${name}=${value};expires=${expires.toUTCString()};path=/`;
      }

      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) == " ") c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) == 0)
            return c.substring(nameEQ.length, c.length);
        }
        return null;
      }

      // 数据定义
      const dataConfig = {
        years: [
          1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005,
          2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016,
          2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024,
        ],
        births: [
          2052, 2057, 2028, 1934, 1827, 1765, 1696, 1641, 1594, 1588, 1612,
          1581, 1591, 1604, 1587, 1588, 1600, 1635, 1640, 1687, 1655, 1786,

        housePrice: [

          10800, 11500, 12200, 12800, 13200, 13500, 13300, 13400,
        ].map((item) => item / 10000.0),
        marriage: [

          891.0, 891.0, 1011.0, 1213.0, 1200.0, 1213.0, 1236.0, 1324.0, 1346.9,
          1302.0, 1220.0, 1140.0, 1063.0, 1010.0, 947.1, 814.6, 763.6, 683.5,
          768.2, 610.6,
        ].map((item) => item / 100.0),
        divorce: [
          105.6, 113.4, 119.9, 119.2, 120.2, 121.3, 125.0, 117.7, 133.0, 166.5,
          178.5, 191.3, 209.8, 211.0, 240.0, 267.0, 287.0, 310.0, 354.1, 363.7,
          384.1, 415.0, 437.4, 446.1, 470.1, 373.3, 283.9, 210.0, 259.3, 262.1,
        ].map((item) => item / 100.0),
      };

      // 图表配置
      const seriesConfig = {
        births: {
          name: "出生人数（万人）",
          color: "#007AFF",
          darkColor: "#0A84FF",
          yAxis: {
            name: "出生(万人)",
            position: "left",
            min: 0,
            max: 2200,
            color: "#007AFF",
            darkColor: "#0A84FF",
            axisLabel: {
              formatter: function (value) {
                return value + "万";
              },
            },
          },
        },
        population: {
          name: "年末总人口（万人）",
          color: "#34C759",
          darkColor: "#30D158",
          yAxis: {
            name: "人口（万人）",
            position: "right",
            min: 120000,
            max: 145000,
            color: "#34C759",
            darkColor: "#30D158",
            axisLabel: {
              formatter: function (value) {
                return (value / 10000).toFixed(1) + "亿";
              },
            },
          },
        },
        housePrice: {
          name: "全国平均房价（万元/㎡）",
          color: "#FF9500",
          darkColor: "#FF9F0A",
          yAxis: {
            name: "房价（万元/㎡）",
            position: "right",
            min: 0.15,
            max: 1.4,
            color: "#FF9500",
            darkColor: "#FF9F0A",
            axisLabel: {
              formatter: function (value) {
                return value + "万元";
              },
            },
          },
        },
        marriage: {
          name: "结婚登记人数（万对）",
          color: "#FF3B30",
          darkColor: "#FF453A",
          yAxis: {
            name: "结/离婚（万对）",
            position: "right",
            min: 0,
            max: 15,
            color: "#FF3B30",
            darkColor: "#FF453A",
            axisLabel: {
              formatter: function (value) {
                return value + "万对";
              },
            },
          },
        },
        divorce: {
          name: "离婚登记人数（万对）",
          color: "#AF52DE",
          darkColor: "#BF5AF2",
          yAxis: {
            name: "结/离婚（万对）",
            position: "right",
            min: 0,
            max: 15,
            color: "#AF52DE",
            darkColor: "#BF5AF2",
            axisLabel: {
              formatter: function (value) {
                return value + "万对";
              },
            },
          },
        },
      };

      let myChart = null;
      let currentTheme = "light";

      // 初始化图表
      function initChart() {
        try {
          const chartDom = document.getElementById("main");
          if (!chartDom) {
            console.error("图表容器不存在");
            return;
          }

          // 确保ECharts已加载
          if (typeof echarts === "undefined") {
            console.error("ECharts未加载");
            return;
          }

          myChart = echarts.init(chartDom);

          // 监听窗口大小变化
          window.addEventListener("resize", function () {
            if (myChart) {
              myChart.resize();
            }
          });

          // 恢复用户设置
          restoreUserSettings();

          // 延迟刷新图表，确保DOM完全加载
          setTimeout(() => {
            refreshChart();
          }, 200);
        } catch (error) {
          console.error("初始化图表失败:", error);
        }
      }

      // 恢复用户设置
      function restoreUserSettings() {
        // 恢复主题
        const savedTheme = getCookie("chartTheme");
        if (savedTheme === "dark") {
          toggleTheme();
        }

        // 恢复年份范围
        const savedYearRange = getCookie("yearRange");
        if (savedYearRange) {
          // 移除所有选中状态
          document
            .querySelectorAll("#yearSelectors .radio-item")
            .forEach((el) => {
              el.classList.remove("checked");
            });

          // 设置对应的单选按钮为选中状态
          const targetRadio = document.querySelector(
            `#yearSelectors .radio-item[data-value="${savedYearRange}"]`
          );
          if (targetRadio) {
            const radio = targetRadio.querySelector('input[type="radio"]');
            radio.checked = true;
            targetRadio.classList.add("checked");
          }
        }

        // 恢复数据选择
        const savedDataSelection = getCookie("dataSelection");
        if (savedDataSelection) {
          const selectedData = JSON.parse(savedDataSelection);
          document
            .querySelectorAll('#dataSelectors input[type="checkbox"]')
            .forEach((checkbox) => {
              checkbox.checked = selectedData.includes(checkbox.id);
              const item = checkbox.closest(".checkbox-item");
              if (checkbox.checked) {
                item.classList.add("checked");
              } else {
                item.classList.remove("checked");
              }
            });
        }
      }

      // 切换主题
      function toggleTheme() {
        const body = document.body;
        const themeToggle = document.getElementById("themeToggle");

        if (body.classList.contains("dark-theme")) {
          body.classList.remove("dark-theme");
          themeToggle.textContent = "🌙";
          themeToggle.classList.remove("dark");
          currentTheme = "light";
        } else {
          body.classList.add("dark-theme");
          themeToggle.textContent = "☀️";
          themeToggle.classList.add("dark");
          currentTheme = "dark";
        }

        setCookie("chartTheme", currentTheme);

        // 重新渲染图表以适应主题
        if (myChart) {
          refreshChart();
        }
      }

      // 获取年份范围数据
      function getYearRangeData() {
        const yearRange = parseInt(
          document.querySelector('#yearSelectors input[type="radio"]:checked')
            .value
        );
        const currentYear = 2024;
        const startYear = currentYear - yearRange + 1;

        const startIndex = dataConfig.years.indexOf(startYear);
        const endIndex = dataConfig.years.length;

        // 确保索引有效
        if (startIndex === -1) {
          console.warn(`起始年份 ${startYear} 不在数据范围内`);
          return {
            years: dataConfig.years,
            data: dataConfig,
          };
        }

        const filteredYears = dataConfig.years.slice(startIndex, endIndex);
        const filteredData = {};

        Object.keys(dataConfig).forEach((key) => {
          if (key !== "years") {
            filteredData[key] = dataConfig[key].slice(startIndex, endIndex);
          }
        });

        return {
          years: filteredYears,
          data: filteredData,
        };
      }

      // 获取选中的数据
      function getSelectedData() {
        const selected = [];
        document
          .querySelectorAll('#dataSelectors input[type="checkbox"]:checked')
          .forEach((checkbox) => {
            selected.push(checkbox.id);
          });

        // 保存到Cookie
        setCookie("dataSelection", JSON.stringify(selected));

        return selected;
      }

      // 刷新图表
      function refreshChart() {
        if (!myChart) {
          console.warn("图表未初始化");
          return;
        }

        const loading = document.getElementById("loading");
        loading.style.display = "block";

        setTimeout(() => {
          try {
            const selectedData = getSelectedData();

            if (selectedData.length === 0) {
              loading.style.display = "none";

              // 显示一个提示性的图表
              const emptyOption = {
                title: {
                  text: "请选择要显示的数据",
                  left: "center",
                  top: 20,
                  textStyle: {
                    fontSize: window.innerWidth <= 768 ? 14 : 16,
                    color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                  },
                },
                tooltip: {
                  trigger: "axis",
                  axisPointer: {
                    type: "cross",
                  },
                },
                legend: {
                  data: [],
                  top: 60,
                  type: "scroll",
                  textStyle: {
                    color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                  },
                },
                grid: {
                  left: "10%",
                  right: "20%",
                  top: "25%",
                  bottom: "15%",
                },
                xAxis: {
                  type: "category",
                  data: [],
                  axisLine: {
                    lineStyle: {
                      color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                    },
                  },
                  axisLabel: {
                    color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                  },
                },
                yAxis: [
                  {
                    type: "value",
                    name: "请选择数据",
                    position: "left",
                    axisLine: {
                      lineStyle: {
                        color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                      },
                    },
                    axisLabel: {
                      color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                    },
                    nameTextStyle: {
                      color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                    },
                  },
                ],
                series: [],
              };

              try {
                myChart.setOption(emptyOption, true);
              } catch (emptyError) {
                console.error("设置空数据配置失败:", emptyError);
              }
              return;
            }

            const option = generateChartOption(selectedData);

            // 检查生成的配置是否有效
            if (!option || !option.series || option.series.length === 0) {
              loading.style.display = "none";
              console.warn("图表配置无效，显示默认配置");

              // 显示一个提示性的图表
              const fallbackOption = {
                title: {
                  text: "请选择要显示的数据",
                  left: "center",
                  top: 20,
                  textStyle: {
                    fontSize: window.innerWidth <= 768 ? 14 : 16,
                    color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                  },
                },
                tooltip: {
                  trigger: "axis",
                  axisPointer: {
                    type: "cross",
                  },
                },
                legend: {
                  data: [],
                  top: 60,
                  type: "scroll",
                  textStyle: {
                    color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                  },
                },
                grid: {
                  left: "10%",
                  right: "20%",
                  top: "25%",
                  bottom: "15%",
                },
                xAxis: {
                  type: "category",
                  data: [],
                  axisLine: {
                    lineStyle: {
                      color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                    },
                  },
                  axisLabel: {
                    color: currentTheme === "dark" ? "#ecf0f1" : "#333",
                  },
                },
                yAxis: [],
                series: [],
              };

              try {
                myChart.setOption(fallbackOption, true);
              } catch (fallbackError) {
                console.error("设置默认配置失败:", fallbackError);
              }
              return;
            }

            // 验证配置的完整性
            if (!option.xAxis || !option.yAxis || !option.series) {
              throw new Error("图表配置不完整");
            }

            // 确保所有系列都有有效的Y轴索引
            option.series.forEach((series, index) => {
              if (
                typeof series.yAxisIndex !== "number" ||
                series.yAxisIndex < 0 ||
                series.yAxisIndex >= option.yAxis.length
              ) {
                console.warn(
                  `系列 ${series.name} 的Y轴索引无效: ${series.yAxisIndex}`
                );
                series.yAxisIndex = 0; // 默认使用第一个Y轴
              }
            });

            // 获取数据用于调试
            const debugYearData = getYearRangeData();
            myChart.setOption(option, true);
            loading.style.display = "none";
          } catch (error) {
            console.error("刷新图表时出错:", error);
            loading.style.display = "none";
            alert("图表刷新失败，请重新选择数据");
          }
        }, 100);
      }

      // 生成图表配置
      function generateChartOption(selectedData) {
        const yAxes = [];
        const series = [];
        const legend = [];

        // 获取年份范围数据
        const yearData = getYearRangeData();
        const years = yearData.years;
        const data = yearData.data;

        // 生成动态标题
        const yearRange = parseInt(
          document.querySelector('#yearSelectors input[type="radio"]:checked')
            .value
        );
        const startYear = 2024 - yearRange + 1;
        const endYear = 2024;

        let titleText = `${startYear}-${endYear}年中国`;
        const dataNames = [];
        selectedData.forEach((dataKey) => {
          const config = seriesConfig[dataKey];
          dataNames.push(config.name.split("（")[0]);
        });

        if (dataNames.length === 1) {
          titleText += dataNames[0];
        } else if (dataNames.length === 2) {
          titleText += dataNames.join("、");
        } else if (dataNames.length > 2) {
          titleText +=
            dataNames.slice(0, -1).join("、") +
            "和" +
            dataNames[dataNames.length - 1];
        }
        titleText += "数据趋势对比";

        // 动态创建Y轴配置
        let leftAxisCount = 0;
        let rightAxisCount = 0;
        const yAxisMap = new Map(); // 用于存储Y轴配置，避免重复

        // 先收集所有需要的Y轴
        selectedData.forEach((dataKey, index) => {
          const config = seriesConfig[dataKey];

          // 检查数据是否存在
          if (!data[dataKey] || !config) {
            console.warn(`数据或配置不存在: ${dataKey}`);
            return;
          }

          // 检查数据数组是否为空
          if (!Array.isArray(data[dataKey]) || data[dataKey].length === 0) {
            console.warn(`数据数组为空: ${dataKey}`);
            return;
          }

          legend.push(config.name);

          // 检查是否已存在相同的Y轴配置（用于结婚和离婚共享Y轴）
          const yAxisKey = `${config.yAxis.name}_${config.yAxis.position}`;

          if (!yAxisMap.has(yAxisKey)) {
            // 创建新的Y轴配置
            const newAxis = { ...config.yAxis };
            newAxis.key = yAxisKey; // 使用Y轴键作为唯一标识

            console.log(
              `创建新Y轴: ${yAxisKey}, 名称: ${newAxis.name}, 位置: ${newAxis.position}`
            );

            // 分配偏移量，避免Y轴重叠
            if (newAxis.position === "left") {
              newAxis.offset = leftAxisCount * 60;
              leftAxisCount++;
            } else {
              newAxis.offset = rightAxisCount * 60;
              rightAxisCount++;
            }

            yAxes.push(newAxis);
            yAxisMap.set(yAxisKey, yAxes.length - 1); // 存储Y轴索引
          } else {
            console.log(`使用已存在的Y轴: ${yAxisKey}`);
          }
        });

        // 添加数据系列
        selectedData.forEach((dataKey, index) => {
          const config = seriesConfig[dataKey];

          // 检查数据是否存在
          if (!data[dataKey] || !config) {
            console.warn(`数据或配置不存在: ${dataKey}`);
            return;
          }

          // 检查数据数组是否为空
          if (!Array.isArray(data[dataKey]) || data[dataKey].length === 0) {
            console.warn(`数据数组为空: ${dataKey}`);
            return;
          }

          // 使用Y轴键来查找对应的Y轴索引
          const yAxisKey = `${config.yAxis.name}_${config.yAxis.position}`;
          const yAxisIndex = yAxisMap.get(yAxisKey);

          // 确保Y轴索引有效
          if (
            typeof yAxisIndex !== "number" ||
            yAxisIndex < 0 ||
            yAxisIndex >= yAxes.length
          ) {
            console.warn(
              `无效的Y轴索引: ${yAxisIndex} for ${config.name}, dataKey: ${dataKey}, yAxisKey: ${yAxisKey}`
            );
            console.warn(`可用的Y轴键:`, Array.from(yAxisMap.keys()));
            return;
          }

          series.push({
            name: config.name,
            type: "line",
            data: data[dataKey],
            yAxisIndex: yAxisIndex,
            smooth: true,
            lineStyle: {
              color: currentTheme === "dark" ? config.darkColor : config.color,
            },
            itemStyle: {
              color: currentTheme === "dark" ? config.darkColor : config.color,
            },
          });
        });

        return {
          title: {
            text: titleText,
            left: "center",
            top: 20,
            textStyle: {
              fontSize: window.innerWidth <= 768 ? 14 : 16,
              color: currentTheme === "dark" ? "#ecf0f1" : "#333",
            },
          },
          tooltip: {
            trigger: "axis",
            axisPointer: {
              type: "cross",
            },
          },
          legend: {
            data: legend,
            top: 60,
            type: "scroll",
            textStyle: {
              color: currentTheme === "dark" ? "#ecf0f1" : "#333",
            },
          },
          grid: {
            left: "15%",
            right: "30%",
            top: "25%",
            bottom: "15%",
          },
          xAxis: {
            type: "category",
            data: years,
            axisLine: {
              lineStyle: {
                color: currentTheme === "dark" ? "#ecf0f1" : "#333",
              },
            },
            axisLabel: {
              color: currentTheme === "dark" ? "#ecf0f1" : "#333",
            },
          },
          yAxis: yAxes.map((axis) => ({
            type: "value",
            name: axis.name,
            position: axis.position || "left",
            offset: axis.offset || 0,
            min: axis.min,
            max: axis.max,
            axisLine: {
              lineStyle: {
                color: currentTheme === "dark" ? axis.darkColor : axis.color,
              },
            },
            axisLabel: {
              color: currentTheme === "dark" ? "#f5f5f7" : axis.color,
              formatter: axis.axisLabel
                ? axis.axisLabel.formatter
                : function (value) {
                    return value;
                  },
              // 移动端优化：减少标签数量
              interval: window.innerWidth <= 768 ? "auto" : 0,
            },
            nameTextStyle: {
              color: currentTheme === "dark" ? "#f5f5f7" : axis.color,
            },
            // 确保Y轴显示
            show: true,
            splitLine: {
              show: false,
            },
          })),
          series: series,
        };
      }

      // 全选
      function selectAll() {
        document
          .querySelectorAll('#dataSelectors input[type="checkbox"]')
          .forEach((checkbox) => {
            checkbox.checked = true;
            checkbox.closest(".checkbox-item").classList.add("checked");
          });
        refreshChart();
      }

      // 清空
      function clearAll() {
        document
          .querySelectorAll('#dataSelectors input[type="checkbox"]')
          .forEach((checkbox) => {
            // 保留出生人口和总人口的勾选
            if (checkbox.id === "births" || checkbox.id === "population") {
              checkbox.checked = true;
              checkbox.closest(".checkbox-item").classList.add("checked");
            } else {
              checkbox.checked = false;
              checkbox.closest(".checkbox-item").classList.remove("checked");
            }
          });
        refreshChart();
      }

      // 绑定事件监听器
      document.addEventListener("DOMContentLoaded", function () {
        // 复选框点击事件
        document
          .querySelectorAll("#dataSelectors .checkbox-item")
          .forEach((item) => {
            item.addEventListener("click", function () {
              const checkbox = this.querySelector('input[type="checkbox"]');
              checkbox.checked = !checkbox.checked;

              if (checkbox.checked) {
                this.classList.add("checked");
              } else {
                this.classList.remove("checked");
              }

              refreshChart();
            });
          });

        // 年份选择器事件
        document
          .querySelectorAll("#yearSelectors .radio-item")
          .forEach((item) => {
            item.addEventListener("click", function () {
              const radio = this.querySelector('input[type="radio"]');
              radio.checked = true;

              // 移除所有选中状态
              document
                .querySelectorAll("#yearSelectors .radio-item")
                .forEach((el) => {
                  el.classList.remove("checked");
                });

              // 添加当前选中状态
              this.classList.add("checked");

              setCookie("yearRange", radio.value);
              refreshChart();
            });
          });

        // 主题切换事件
        document
          .getElementById("themeToggle")
          .addEventListener("click", toggleTheme);

        // 初始化图表
        initChart();
      });
    </script>
