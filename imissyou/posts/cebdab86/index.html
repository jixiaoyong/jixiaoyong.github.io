,&quot;&lt;p&gt;依旧是在实验室。&lt;/p&gt;\n&lt;p&gt;这是端午节过后第一天正式上课，实验间隙，实验室里面众生百态。&lt;/p&gt;\n&lt;p&gt;复习的一两桌，紧张的看着各自的复习资料，抑或嘴里念念有词，手里指指画画；寂静的一两桌，或趴或俯，眼睛盯着手机，又或脑袋躺在桌面，或玩或眠；然而最多的则是那一两桌叽叽喳喳的几张嘴，游戏足球明星和星座，各有一片春秋。&lt;/p&gt;\n&lt;p&gt;充满现代化气息的实验仪器静静的排列在各处，冰冷地安静地，看着这众生，一批又一批。&lt;/p&gt;\n&lt;p&gt;无言，春秋轮换，人来人往。来到这里的人一年年更替，才人庸人奇人蠢人碌碌无为之人，各色人物各色风景，走马灯似的替换，有什么变的，有什么不变的。&lt;/p&gt;\n&lt;p&gt;变得是人，不变的，是人做的事，是做事的人。&lt;/p&gt;\n&lt;p&gt;总有人做蠢事，也总会有做蠢事的人。&lt;/p&gt;\n&lt;p&gt;只是，对于个人，这未免有些残酷，有些无奈。&lt;/p&gt;\n&lt;p&gt;有什么办法能够将人从生活中抽离，然后去寻找自己的春暖花开。然而我们都知道这是不可能的，苦恼与琐事从来都在，苦恼与琐事就是我们的生活。&lt;/p&gt;\n&lt;p&gt;人啊，要是明白什么是生活什么是妥协就好了。但或许，生活就是妥协，妥协就是我们的生活。&lt;/p&gt;\n&lt;p&gt;那为什么又要有那么多的人，一次又一次的告诉我们，不一样的生活，不一样的世界。或许对于庸碌者来说，理想本身就是一种煎熬，一种惩罚。&lt;/p&gt;\n&lt;p&gt;但，真的能够安心的成为一个庸人的又有几个，人总是想着能够更好一点，能够改变一点。&lt;/p&gt;\n&lt;p&gt;那就应当付出，那就应当改变，那就应当承受这改变带来的一切苦痛与哀乐。&lt;/p&gt;\n&lt;p&gt;死，然后生。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-06-23 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-03-19 13:00:24&quot;],&quot;timestamp&quot;:[0,1434988800000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;\&quot;作者描绘了端午节后实验室里的众生百态：有人紧张复习，有人睡觉玩耍，也有人谈天说地。面对冰冷的实验仪器和年复一年的人员更替，作者思考了人与事的变化，感叹生活中的妥协与无奈。尽管如此，作者认为不应甘于平庸，而应付出努力去改变，承受改变带来的苦痛与哀乐，在死而后生中寻找意义。\&quot;&quot;],&quot;summaryEn&quot;:[0,&quot;\&quot;The author depicts the various scenes in the laboratory after the Dragon Boat Festival: some are reviewing nervously, some are sleeping or playing, and others are chatting. Facing cold experimental instruments and the yearly turnover of people, the author reflects on the changes in people and things, sighing at the compromises and helplessness in life. Nevertheless, the author believes one should not be content with mediocrity but should strive to change, bearing the pain and joy that change brings, and finding meaning in rebirth after death.\&quot;&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-06-23.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;9d7a36e7&quot;],&quot;title&quot;:[0,&quot;变化&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;41acf799&quot;],&quot;title&quot;:[0,&quot;随想&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island><astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.DqizqNHL.js" component-export="default" renderer-url="/imissyou/_astro/client.Dhu_hMGW.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
