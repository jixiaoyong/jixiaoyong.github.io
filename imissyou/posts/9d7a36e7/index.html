底发表在哪里，但我仍愿意且乐意回忆起那个时刻——毕竟那是我唯一能够资格拿来“光辉历史”，虽然并没有多少意义。&lt;/p&gt;\n&lt;p&gt;我在想，作为一个人来说，看到一个东西并由此联想到一些事情，发出一些自己的感慨，应当是最正常不过的事情。&lt;/p&gt;\n&lt;p&gt;我刚开始玩 QQ 空间大概是在 2010 年的时候，那时候我刚刚上了高中，有了自己的手机，同时也申请了自己的 QQ，这个 QQ 我一直用到现在。似乎青春期的少年总有太多的烦恼与忧伤，遇到些什么，想到些什么便就写出来，到头来多多少少也积攒了些许文字。现在看来许多都难免稚嫩，但好歹也算是真实的记录自己下了当时的某种状态。&lt;/p&gt;\n&lt;p&gt;记得许久之前，为了在功能机上打出一段字来，用少的可怜的手机流量，尝试网上一个又一个打字软件，然后充满期待的看着自己的想法，从脑海里流出，通过手指在键盘上的敲击变成一个又一个字符，生成显示屏上面的一个 TXT 文件，变成 QQ 空间里的一片日志。当时还想，某日有了电脑，真当有了最便捷的工具，该能够写多少文字出来。&lt;/p&gt;\n&lt;p&gt;时间在变，人也在变。一直看纸质书的我，在有了第二部手机后开始正式的接触电子书。说互联网是人类最伟大的发明一点也不会过分，在堪称信息大爆炸的当代，互联网将绝大部分人类文明的信息资源无偿共享，这是我们这一代人的幸运。当互联网慢慢的走进我的生活中，首先改变的是我的阅读方式，再也不用受限于昂贵且难以找寻的纸质书的限制，在互联网上可以很容易接触到很多优秀的电子书，随时、随地，随心所欲。&lt;/p&gt;\n&lt;p&gt;然而电子书并并没有彻底的革新我的阅读方式，有的作品还是习惯捧着纸质书欣赏，那份天然的触感是电子书永远也无法替代的，一直到现在我还是习惯在电子书上看到好的作品时，再买份纸质版阅读或珍藏。不管怎么说，电子书还是给了我很不一样的阅读体验，只是当时初次接触互联网，而晚上能找到的书又大多都是些乌七八糟的快餐文，能遇到好的作品大多数时候都得靠运气。是以虽然能沙里淘金般遇到几部好的作品，最开始的能让我印象深刻的作品大多还都是通过纸质书阅读的，其中，各类语文课文中的好文章竟然是对我影响最为深刻的一部分，当然这是我现在才意识到的。&lt;/p&gt;\n&lt;p&gt;再后来到了大学，有了智能设备，通过几款还算不错的阅读软件，我所读的书中十之八九都是通过电子读物阅读的，而这也使得我可以更广的接触到很多很多类型的书籍，其中有很多可能是我这一辈子都无法接触到纸质书的作品。但随之也有了一个不小的毛病，读书时总是直觉不自觉的盯着进度条看，于是乎阅读的速度慢慢的快了，对于书的品味理解却是慢慢的少了。再到最近，似乎读书不是自己一个人的事，阅读后的那个分享按钮似乎比整个阅读过程还要重要。冥冥之中似乎有什么催促着自己，这，大概就是浮躁吧。&lt;/p&gt;\n&lt;p&gt;以前总是看文章里面说，现代社会是个浮躁不安的社会，人们都趋向于快餐式消费，现在想想自己又何尝不是掉进了这个漩涡之中呢。只是，从什么时候开始这样的却是早已无法考究了。&lt;/p&gt;\n&lt;p&gt;只是，这样是不好的。&lt;/p&gt;\n&lt;p&gt;还记得，之前的无数个夜晚，我曾幻想，等到拥有自己的电脑，可以随时随地联通互联网时，一定要把自己的想法看法，用一个个方格文字写下来，张贴出来，把自己活过的每一天都记录下来。可是时间过了这么久，一个个条件都慢慢满足了，我确实越来越懒了，懒得想，懒得写，懒得思考自己整天都在干什么，懒得去想自己整天到底是为了什么。&lt;/p&gt;\n&lt;p&gt;我愧于说自己是因为太忙了才没时间做这些事情。&lt;/p&gt;\n&lt;p&gt;人，大概天生都有点惰性，缺乏压力，即就是缺乏前进的动力。生于忧患死于安乐。道理都懂，坚持不易，但并不是不能坚持。&lt;/p&gt;\n&lt;p&gt;按理说，在本文的结尾应当有些励志的、向上的、阳光的话语，以此来冲淡行文至此的消极的压抑感。但，我实在想不出什么冠冕堂皇的借口来让自己说一段根本做不到的道理来，听过很多道理，依旧没办法过好这一生。能讲出道理来安慰别人的人，可能却是最没办法印证这些道理的人，习惯了说道理安慰别人，其实只不过是最简单粗暴的放弃责任，毕竟道理就是这样，你总不能说我说的不对吧。然而这并没有什么作用。&lt;/p&gt;\n&lt;p&gt;那么，看行动吧。&lt;/p&gt;\n&lt;p&gt;JUST DO IT!&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-10-05 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:21:58&quot;],&quot;timestamp&quot;:[0,1443974400000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者感叹近期写作灵感的枯竭，回顾了自己从小学首次发表文章到接触互联网写作的历程。互联网改变了作者的阅读和写作方式，从纸质书到电子书，从QQ空间日志到博客。然而，随着便利性的增加，作者发现自己变得浮躁和懒惰，阅读变得快餐化，思考变得稀缺。文章最后，作者反思了自己的惰性，并决心付诸行动，重新开始记录和思考。&quot;],&quot;summaryEn&quot;:[0,&quot;The author laments the recent drying up of writing inspiration and reviews their journey from publishing their first article in elementary school to writing on the internet. The internet has changed the author&#39;s way of reading and writing, from paper books to e-books, and from QQ Zone logs to blogs. However, with increased convenience, the author finds themselves becoming impetuous and lazy, with reading becoming fast-food-like and thinking becoming scarce. Finally, the author reflects on their inertia and resolves to take action to restart recording and thinking.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-10-05.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;1492843a&quot;],&quot;title&quot;:[0,&quot;《无声告白》读书笔记&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;cebdab86&quot;],&quot;title&quot;:[0,&quot;随想五&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.BgsxrJFb.js" component-export="default" renderer-url="/imissyou/_astro/client.DpoKbfDq.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
