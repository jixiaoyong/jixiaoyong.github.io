          currentTheme = "light";

        }

          document.documentElement.classList.add("dark");

        if (metaThemeColor) {
          metaThemeColor.setAttribute(
            "content",
            currentTheme === "dark" ? "#111111" : "#ffffff",
          );
        }
      })();
