uid="ZIJyj4" component-url="/imissyou/_astro/PostDetailWrapper.NiikyhH1.js" component-export="default" renderer-url="/imissyou/_astro/client.PWbBjEwf.js" props="{&quot;postId&quot;:[0,&quot;8c989346&quot;],&quot;initialPost&quot;:[0,{&quot;id&quot;:[0,&quot;8c989346&quot;],&quot;title&quot;:[0,&quot;有你们，挺好的&quot;],&quot;excerpt&quot;:[0,&quot;有你们，挺好的 世界这么大，遇见你是最美丽的意外。 许多次想说声感谢，话到嘴边，却不知道怎么说出口，很多次拿起笔，却不知道从何说起。木讷的人总是寡断，平白失去致意的机会，空余下长久的哀悔。 然而我确知这表述是必要的，寡言不是借口，呆滞不能肆意，若是长久的不表示出我对于你们给予的友爱的感知与感谢，恐怕我自己都不能原谅自己。 谢谢，希望你能听到。...&quot;],&quot;content&quot;:[0,&quot;&lt;p&gt;有你们，挺好的&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;世界这么大，遇见你是最美丽的意外。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;许多次想说声感谢，话到嘴边，却不知道怎么说出口，很多次拿起笔，却不知道从何说起。木讷的人总是寡断，平白失去致意的机会，空余下长久的哀悔。&lt;/p&gt;\n&lt;p&gt;然而我确知这表述是必要的，寡言不是借口，呆滞不能肆意，若是长久的不表示出我对于你们给予的友爱的感知与感谢，恐怕我自己都不能原谅自己。&lt;/p&gt;\n&lt;p&gt;谢谢，希望你能听到。&lt;/p&gt;\n&lt;p&gt;叶有百色，色形各异，人有万千，自然表示的方式就有不同。有时候特别羡慕个性外放的朋友，喜形于色，大家也跟着开心；有时候特别喜欢性情随和的人，亲切温喉，一起也玩的尽兴；有时特别喜欢机巧伶俐的人，捧梗逗乐，总是有话有料有乐。&lt;/p&gt;\n&lt;p&gt;然而我并不会这些，自己习惯了倒不觉得有什么，但对朋友来说，总是有些不合适。有的人习惯使用话语，有的人喜欢借助文字，而我则只是习惯了聆听。&lt;/p&gt;\n&lt;p&gt;按照用进废退的学说来说，我的语言表达能力应该是在逐年退化，也难免多多少少客串话题终结者，于是更加不多说了。&lt;/p&gt;\n&lt;p&gt;幸而，遇见了你们，很难想像缺失了你们，我的大学生活会是什么样子。这么多人，偏偏就让我遇到这么多这么好的一群孩子，何其幸也。&lt;/p&gt;\n&lt;p&gt;很难说我是怎么一个人，也很难说我这样的人怎么会遇到你们这样子的人，如果这一切只是一个意外的话，那一定是我遇到的最美丽意外。&lt;/p&gt;\n&lt;p&gt;但凡人都该有自知之明，更当懂得满足与感恩。我深知这一切所获都远远超过我所给予的，我也明了这一切都是我无法反馈的，但我尤其不忍也不能沉默不语，虽然称赞并不能更加玫瑰鲜艳，但至少可以让它知道有人已感受到它的芬香醇美，至少让它知道有人为它温暖感动。&lt;/p&gt;\n&lt;p&gt;是的，温暖而感动。&lt;/p&gt;\n&lt;p&gt;人，至少包括我，大多是自私的，所以能感受到的都只是与自己有关的事情，能感知到的，只有自己身边的事物。但你们之对于我，却不是。佛家说，千年才修得擦肩过，也不知前世修了多少善缘，一下子才能遇到这么好的人，我还什么都没做，我又能够做什么。感谢，都过于单薄。&lt;/p&gt;\n&lt;p&gt;我深知，自己付出的实在太少。很多次聚会都有事错过，很多次相聚也只是看着大家言笑，甚至于平时也疏忽和大家交流，我深知自己太过沉默，沉默呵，沉默呵，总在沉默中消亡。然而我并不甘如此，也深信不能如此，但事实还是如此，习惯的惰性与固扭的沉默已足以扼杀一切，幸而你们并没有离去——这需要多么大的勇气、包容还有友爱。&lt;/p&gt;\n&lt;p&gt;总不能让朋友老是牵挂，也不能使好友总是承受着由于自己粗心所致的没落，是时候，道一声谢谢，你所做的，我都知晓并且感动着，相信我，我已小心收好了这份温暖。&lt;/p&gt;\n&lt;p&gt;终于，说了许久还是把自己绕进去了，我这般的人，果然还是少说话的好。嗯，偷着乐就行。&lt;/p&gt;\n&lt;p&gt;遇见你，是最美的意外。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-12-06 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:22:37&quot;],&quot;timestamp&quot;:[0,1449331200000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0,&quot;https://jixiaoyong.github.io/images/20200407223605.jpg&quot;],&quot;summaryZh&quot;:[0,&quot;这是一篇致友人的感谢信。作者感叹于自己在大学期间遇到的美好的人们，尽管自己性格木讷、不善言辞，却依然得到了朋友们的包容与友爱。作者深知自己付出的太少，而收获的太多，因此特意写下这篇文字，表达对朋友们的感激之情，认为遇见他们是生命中最美丽的意外。&quot;],&quot;summaryEn&quot;:[0,&quot;This is a thank-you letter to friends. The author marvels at the wonderful people they met during college. Despite being dull and inarticulate, they still received tolerance and friendship from their friends. The author knows that they have given too little and received too much, so they wrote this text to express their gratitude to their friends, believing that meeting them was the most beautiful accident in life.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-12-06.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;97dd5149&quot;],&quot;title&quot;:[0,&quot;钱的由来&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;60570382&quot;],&quot;title&quot;:[0,&quot;社交--我的互联网生命简史&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.SlAx7C4N.js" component-export="default" renderer-url="/imissyou/_astro/client.PWbBjEwf.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <
