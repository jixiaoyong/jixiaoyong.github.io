的过程中，或随波逐流，或中流砥柱，大抵都要有个念想，有个目的，或者低微，或者崇高，天下熙熙，皆为利往，有所追求，才能有所作为。&lt;/p&gt;\n&lt;p&gt;只是不同人不同的背景，所处的环境或多或少便左右着人的抉择，大多数时候，往往是环境成就个人。&lt;/p&gt;\n&lt;p&gt;然而无论愿意与否，到了一定的时候，个体便要脱离熟悉的环境，开一片新天地，好做一番成就。离开熟悉的环境是痛苦的，但同时也是令人激动的，虽然到达的依旧是他人的故乡，但终究会有些改变。&lt;/p&gt;\n&lt;p&gt;故乡是永远只是用来怀念的，故乡也只有在回忆中才能重逢。成长就是一次次远离曾经的故乡，生活即是一遍遍走向他人的故乡。&lt;/p&gt;\n&lt;p&gt;新鲜的环境里特有的新事物早已蓄势待发，期待着即将到来的碰撞。像是海水拍打礁石，像是狂风鼓吹船帆，像是闪电划裂云天，新征程绝不会一帆风顺，但却充满诱惑。艰险的旅途中，自然有阳光，有雨露，还有途中一个个无人踏足的海岛，但这都不是终点，船长的生命在海上，只在一次次的征途中。&lt;/p&gt;\n&lt;p&gt;于是每个人生而流浪，每个人注定漂泊。&lt;/p&gt;\n&lt;p&gt;于是每一次起航都是为了更好的相遇，每一次驻足都是为出发做准备。永远在途中，要么前进，要么死亡，生活给世人的选择并不是很多。&lt;/p&gt;\n&lt;p&gt;世人是苦的，却也是幸福的。被欲望所驱使，为思想所困惑，却也为有所追求而欣喜，为有所思考而存在。曾经千百次无法入眠的夜晚，我拷问自己生活的意义，到头来却发现生活就是生活，生活的意义也就是生活。当下即是生活，生活就在当下。&lt;/p&gt;\n&lt;p&gt;当下，我们正在漂泊。一直在流浪，永远在漂泊。&lt;/p&gt;\n&lt;p&gt;漂泊，便是你我的宿命。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2016-08-08 16:07:21&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 15:40:43&quot;],&quot;timestamp&quot;:[0,1470643641000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者探讨了生命的意义和漂泊的宿命。认为生活充满了艰难困苦，但人们依然努力克服。成长意味着一次次离开熟悉的故乡，走向未知的远方。新环境虽然充满挑战，但也充满诱惑。作者最终认为，每个人生而流浪，漂泊是注定的宿命，生活的意义就在于当下的生活本身，在于一次次的起航和漂泊。&quot;],&quot;summaryEn&quot;:[0,&quot;The author explores the meaning of life and the destiny of drifting. They believe that life is full of hardships, but people still strive to overcome them. Growing up means leaving the familiar hometown time and again to head for the unknown distance. Although the new environment is full of challenges, it is also full of temptations. The author ultimately concludes that everyone is born to wander, drifting is a destined fate, and the meaning of life lies in the life of the present moment, in the repeated departures and drifting.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2016-08-08.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;31e89f0&quot;],&quot;title&quot;:[0,&quot;小巷&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;4a17b156&quot;],&quot;title&quot;:[0,&quot;Hello World&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.BgsxrJFb.js" component-export="default" renderer-url="/imissyou/_astro/client.DpoKbfDq.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
