uid="1fscr9" component-url="/imissyou/_astro/PostDetailWrapper.NiikyhH1.js" component-export="default" renderer-url="/imissyou/_astro/client.PWbBjEwf.js" props="{&quot;postId&quot;:[0,&quot;39442e04&quot;],&quot;initialPost&quot;:[0,{&quot;id&quot;:[0,&quot;\&quot;39442e04\&quot;&quot;],&quot;title&quot;:[0,&quot;魔幻·2017&quot;],&quot;excerpt&quot;:[0,&quot;Anything is possible. 我喜欢依偎着夕阳看大海，看着他们走进茫茫人海，翻滚过一座又一座大山，却不见鸟儿飞归向何方。 1 人难免被惰性禁锢，再加上一点虚无的旧事，保不齐失了前行的动力。然而世事从来不遂人愿，改变，总是推着人前进。 2017，遇到了一些人，告别了一些人。时间真是善变于作弄人，离了的、聚了的，新识的、故交的，怎么样都躲不过时间造化。 相忘江湖。...&quot;],&quot;content&quot;:[0,&quot;&lt;blockquote&gt;\n&lt;p&gt;Anything is possible.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;我喜欢依偎着夕阳看大海，看着他们走进茫茫人海，翻滚过一座又一座大山，却不见鸟儿飞归向何方。&lt;/p&gt;\n&lt;h2&gt;1&lt;/h2&gt;\n&lt;p&gt;人难免被惰性禁锢，再加上一点虚无的旧事，保不齐失了前行的动力。然而世事从来不遂人愿，改变，总是推着人前进。&lt;/p&gt;\n&lt;p&gt;2017，遇到了一些人，告别了一些人。时间真是善变于作弄人，离了的、聚了的，新识的、故交的，怎么样都躲不过时间造化。&lt;/p&gt;\n&lt;p&gt;相忘江湖。&lt;/p&gt;\n&lt;p&gt;选择，变、不变。恍惚游醉乡，别了旧日，才知道天地相貌，璀璨非常。入了人间，方晓得柴米价几何，苦辣滋味。&lt;/p&gt;\n&lt;h2&gt;2&lt;/h2&gt;\n&lt;p&gt;也曾贪恋蔷薇，而他却只不过是随手折了枝花，却不该像溺了水人似的，胡乱捉住当做救命稻草。境遇不同，眼界相异，自然有不同判断。实在抱歉，多有叨扰，多谢多谢。&lt;/p&gt;\n&lt;p&gt;闲来常翻旧时书，却不想故人旧事多做古，王谢堂前依旧，不复当时少年样。混沌不知，猝然神伤。他人打趣如此这番，经年不过语及二三，曾笑张三李四陌路人，不想如今忘江湖。再看他人参差眼前事，不堪回首长安远。&lt;/p&gt;\n&lt;h2&gt;3&lt;/h2&gt;\n&lt;p&gt;年少无知不经事，好为人师不知羞。路，从来都是自己一步步踏出来的，别人又如何能指点一二。自己已经迷途不知返，如何也敢遑论他人。愿你认真选了方向，勇敢且坚定，描绘自己的未来。&lt;/p&gt;\n&lt;p&gt;心里存寄着一丝温暖，方才好面对这人鬼江湖。高堂万里，常寄思心卧枕旁。衔环结草长有期。且把这份暖意，化作周身重犀铠甲，砥砺河山。&lt;/p&gt;\n&lt;p&gt;把一壶老酒，醉十里渭水，卧冰雪秦川，趟万千神州。常把只影抛身后，却向红日舞醉剑。胡乱言语，晓夜孤灯与谁说。&lt;/p&gt;\n&lt;p&gt;左右繁华真一梦。&lt;/p&gt;\n&lt;p&gt;残杯冷炙不足惜，华章初展，更待迤逦万千。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2018-01-01 18:01:01&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:21:45&quot;],&quot;timestamp&quot;:[0,1514800861000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[[0,&quot;岁岁今朝&quot;]]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者回顾了魔幻的2017年，感叹于人生的变迁和世事的无常。文章分为三个部分，分别探讨了惰性与改变、人际关系的聚散离合以及自我成长的独立性。作者认为路是自己走出来的，不应盲目听从他人指点，而应勇敢坚定地描绘自己的未来。最后，作者表达了对未来的期许，愿将温暖化作铠甲，砥砺前行。&quot;],&quot;summaryEn&quot;:[0,&quot;The author reviews the magical year of 2017, sighing at the changes in life and the impermanence of worldly affairs. The article is divided into three parts, discussing inertia and change, the gathering and parting of interpersonal relationships, and the independence of self-growth. The author believes that the path is walked by oneself, and one should not blindly follow others&#39; advice but should bravely and firmly depict one&#39;s own future. Finally, the author expresses expectations for the future, wishing to turn warmth into armor and forge ahead.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2018-01-01.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;a306e7f&quot;],&quot;title&quot;:[0,&quot;从来梦一场&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;25e06c11&quot;],&quot;title&quot;:[0,&quot;秋引&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.SlAx7C4N.js" component-export="default" renderer-url="/imissyou/_astro/client.PWbBjEwf.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
