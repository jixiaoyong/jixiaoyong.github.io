&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;To be or not to be，是不是只有面对生与死的时候，选择才那么凝重庄严？是不是只有存或亡的关头，抉择才值得三思而定？&lt;/p&gt;\n&lt;p&gt;不，不是。&lt;/p&gt;\n&lt;p&gt;选择不一定正确，甚至连“正确”这个词都无从谈起，选择就是选择，左或者右，不过是选择。&lt;/p&gt;\n&lt;p&gt;只是目前，以及将来，受了这当下，以及前日的选择的影响，越走越远。不同于真的猛士，时下所能做的，不过是顺从于当时的环境，游流在气氛的裹挟，在做出这样或那样的选择的同时，推搡于自己所塑成的未来。&lt;/p&gt;\n&lt;p&gt;不是这样做最好，而是只能这样做。&lt;/p&gt;\n&lt;p&gt;从某种程度上，时间是可恶的。错误的时间里，遇到谁都只能是一场注定的，无可挽回的，锥心的错误。&lt;/p&gt;\n&lt;hr&gt;\n&lt;p&gt;很多时候，把一切推给时间是再好不过了，毕竟时间永恒且沉默，从不反驳。但逃避从来不曾解决问题，在未来的时间里，曾经掩饰的回避的仍会一次又一次的重演，一次又一次发生，恍若往昔，毕竟时间沉默且永恒，从不偏袒。&lt;/p&gt;\n&lt;p&gt;2016，以及之前的 2015、2014、2013 等等，做过很多选择，感谢时间，依旧公正如斯。&lt;/p&gt;\n&lt;p&gt;公正如斯，无情如斯。&lt;/p&gt;\n&lt;p&gt;往事熙熙，历历在目，嬉笑怒骂，冷暖自知。过去的只得让随他沙逝，暖心的聊以慰籍，伤心的少思罢了，无所谓欢喜，无所谓忧虑，无所谓，该过去的总会淡忘，该承受的必将来临。&lt;/p&gt;\n&lt;p&gt;再见 2016，再见，你们。&lt;/p&gt;\n&lt;hr&gt;\n&lt;p&gt;时间仍在前进，事情也会愈来愈多，过去的和没过去的，都应该有个节点，辞去过往，重新起步。&lt;/p&gt;\n&lt;p&gt;郑重道别，从此相忘江湖，相逢一笑，往事如烟。独角戏里，开始和结束，都只能有一个观众，一个演员。最好最好的祝福，来日方长，且好好的生活。&lt;/p&gt;\n&lt;p&gt;于是在这个时刻，准备着踏入新的纪元，赋予时间以象征，给予自己以依托，断别了昨日，来吧，新年。&lt;/p&gt;\n&lt;p&gt;2016，再也不见。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2017-01-01 17:01:01&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:20:41&quot;],&quot;timestamp&quot;:[0,1483261261000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[[0,&quot;岁岁今朝&quot;]]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者以“FUCK OFF 2016”为题，表达了对过去一年的告别和对未来的期许。文章探讨了选择的无奈和时间的公正与无情，认为许多选择并非出于本心，而是被环境裹挟的结果。尽管往事历历在目，作者决心放下过往的欢喜与忧虑，郑重道别，重新起步，迎接新的纪元。&quot;],&quot;summaryEn&quot;:[0,&quot;Titled \&quot;FUCK OFF 2016\&quot;, the author expresses their farewell to the past year and expectations for the future. The article explores the helplessness of choices and the fairness and ruthlessness of time, arguing that many choices are not made from the heart but are the result of being swept along by the environment. Although the past is vivid, the author is determined to let go of past joys and worries, bid a solemn farewell, restart, and welcome a new era.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2017-01-01.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;ce99c7c0&quot;],&quot;title&quot;:[0,&quot;小镇来雪&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;31e89f0&quot;],&quot;title&quot;:[0,&quot;小巷&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island><astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.DqizqNHL.js" component-export="default" renderer-url="/imissyou/_astro/client.Dhu_hMGW.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
