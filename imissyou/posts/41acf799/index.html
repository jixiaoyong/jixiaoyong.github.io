uid="euF6C" component-url="/imissyou/_astro/PostDetailWrapper.NiikyhH1.js" component-export="default" renderer-url="/imissyou/_astro/client.PWbBjEwf.js" props="{&quot;postId&quot;:[0,&quot;41acf799&quot;],&quot;initialPost&quot;:[0,{&quot;id&quot;:[0,&quot;41acf799&quot;],&quot;title&quot;:[0,&quot;随想&quot;],&quot;excerpt&quot;:[0,&quot;今天是 2015 年 6 月 18 日，星期四。 实验室突然停电，所有的工作不得不暂时停止，于是有时间胡思乱想。 实验周已经进行到了第四天，分子生物学大实验。比起之前三天打鱼两天晒网的科创实验，这几天在实验室里面算是比较连续系统的做实验。...&quot;],&quot;content&quot;:[0,&quot;&lt;p&gt;今天是 2015 年 6 月 18 日，星期四。&lt;/p&gt;\n&lt;p&gt;实验室突然停电，所有的工作不得不暂时停止，于是有时间胡思乱想。&lt;/p&gt;\n&lt;p&gt;实验周已经进行到了第四天，分子生物学大实验。比起之前三天打鱼两天晒网的科创实验，这几天在实验室里面算是比较连续系统的做实验。&lt;/p&gt;\n&lt;p&gt;在实验之前并没有参与到选题，安排实验进程等等过程，于是在实验开始的时候比较被动。实验的时候脑袋里面没有比较系统的结构，只是按照老师的安排按部就班。而相比之下在同一组的室友则十分熟练，每一步差不多都是按照自己的安排一步步走。&lt;/p&gt;\n&lt;p&gt;本来以为从去年下半年开始的科创实验好歹能给自己一些收获，至少是实验技能方面的提升。但是就目前的情况看来是自己想多了，回想一下从刚开始做科创，因为有学姐带，再加上只是一个组员，于是实验之前并不考虑太多，到了实验室之后也只是一步一步按照学姐的安排行动，一边看一边学。现在想想自己当时的确并没有花费太多的心思在实验总体安排以及其缘由上面，而且具体操作时并没有太用心。&lt;/p&gt;\n&lt;p&gt;昨天晚上看到了一部纪录片，央视拍的。印象比较深的是其中一个二十几岁的年轻人在大学退学进入华大基因，现在已经有了不错的成绩。当然我并不是说：看！又是一个辍学成功的案例。虽然我也曾有过类似的想法，但我并不认为每个人都会有这样的机会和能力。&lt;/p&gt;\n&lt;p&gt;我记住的是那个孩子在镜头里表现出来的那种幸福感——为自己能够有机会有能力探寻人类基因的奥秘而欣喜。作为一个生物技术专业的学生，不得承认许多年前甚至是现在的我也又对于揭示生命秘密的渴望，用自己的知识从基因入手，解开一个个生物学上面的奥秘，用 ATGC 解释所有的生命现象是一件多么令人幸福的事情。&lt;/p&gt;\n&lt;p&gt;然而事情并不是这样。电脑里那个年龄和我差不多的孩子，现在已经在自己的实验室里面，和自己的同事们从事着自己最喜欢的事情，而我还在烦恼接下来不久的考试，还在实验室里面笨手笨脚然后无所事事，还在被一些琐事烦扰。&lt;/p&gt;\n&lt;p&gt;我并不是一个悲观主意者。但每当我有时间停下来回顾自己过去做的一件件事情，尤其是最近几年的事情，我实在无法故作轻松的告诉自己一切 OK。&lt;/p&gt;\n&lt;p&gt;我骗不了自己，其实我自己可能都不知道自己。&lt;/p&gt;\n&lt;p&gt;这几天的实验大家可能都很累，停电后除了回宿舍的，剩下的喧闹一会儿后也差不多都趴在桌子上睡着了。&lt;/p&gt;\n&lt;p&gt;想想实验第一天老师就和我们一起干到晚上十点左右，早上我们八点去的实验室，中午和下午总共给了两个半小时吃饭的时间。当时想想以后可能不会再这么拼了，没想到第二天晚上十二点多才走出实验楼，而据说还有几个人一两点才能回去。&lt;/p&gt;\n&lt;p&gt;在此之前对于这个老师的印象并不是很好，在实验开始的前几周他召集了我们几个上他实验课的人，用 PPT 简单讲了一会儿就告诉我们接下来的实验的课题，引物，流程都要我们自己设计，对于两年多来一直是按照实验指导书做实验的我们来说，让我们自己设计实验简直是疯了。&lt;/p&gt;\n&lt;p&gt;然而这几天实验居然也顺顺当当的做了下来，自然是比按老师安排做实验要有趣的多。现在才差不多能够理解老师当初的想法，这几天看来，老师果然是艺高人胆大。是个不错的老师，刘华伟。&lt;/p&gt;\n&lt;p&gt;到了老师约定的时间了，实验室依旧没有一丝来电的迹象，看来今天下午的实验可能要泡汤了，突然想起刚刚还没有开始跑的胶被拿去放到了冰箱，但是冰箱也没有电呀，希望不会影响接下来的实验，毕竟剩下的实验材料都打了进去。&lt;/p&gt;\n&lt;p&gt;一切安好，阿门。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-06-18 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:16:22&quot;],&quot;timestamp&quot;:[0,1434556800000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;\&quot;作者记录了2015年6月18日实验室停电时的随想。回顾了分子生物学实验的经历，反思了自己在科创实验中的被动和缺乏思考。通过观看纪录片，感叹于他人对探索生命奥秘的热情，对比自己当前的迷茫与焦虑。尽管对实验设计曾有畏难情绪，但最终顺利完成并对老师有了新的认识。\&quot;&quot;],&quot;summaryEn&quot;:[0,&quot;\&quot;The author reflects on a power outage in the laboratory on June 18, 2015. They review their experience in molecular biology experiments, reflecting on their passivity and lack of thought in previous scientific innovation experiments. Watching a documentary, they admire others&#39; passion for exploring the mysteries of life, contrasting it with their current confusion and anxiety. Despite initial apprehension about experimental design, they successfully completed the task and gained a new appreciation for their teacher.\&quot;&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-06-18.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;cebdab86&quot;],&quot;title&quot;:[0,&quot;随想五&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.SlAx7C4N.js" component-export="default" renderer-url="/imissyou/_astro/client.PWbBjEwf.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
