uot;&lt;p&gt;&lt;img src=\&quot;https://jixiaoyong.github.io/images/20200407230257.jpg\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;仰望星空，你看见了什么&lt;/p&gt;\n&lt;p&gt;最近几天看了几本历史书，几千年的历史，尽是各色人物风起云涌，叱咤风云。&lt;/p&gt;\n&lt;p&gt;无论朝代更替，历史记住的永远都只有那么几个人，或好或坏，被历史看中，在他们死去的千百年以后，仍然活在后世的文字里。然而，本该是属于历史组成绝大部分的多数人，却像是空气般，生老病死，永远被遗忘在他们的那个时代。&lt;/p&gt;\n&lt;p&gt;被遗忘，对于一个生命最大的惩罚莫过于此。&lt;/p&gt;\n&lt;p&gt;一个人出生，成长，死亡，从他第一次睁开眼睛，他会学会走路，会学会言语，会有欣喜，会有哀伤，会有爱怜，会有羡慕，他会遇到很多人，会接触到很多事物，他会有很多想法，会有许多秘密……如果他也曾在某个深夜翘着头看着天空的星星，他会不会想百年之后，会是什么模样？&lt;/p&gt;\n&lt;p&gt;当然，如果是以前，人们或许按着转世轮回的规则，评判着前世的作为，安排下一世还是投到西湖旁一棵柳树上做一次草木，还是投到凤鸾金殿中当一回皇帝老子。因此这一世无论如何，至少还有机会在下一世轮回里好好风光一番，那么一不小心，前世便就是历史里某个叱咤风云的响当当的人物也未尝不可。&lt;/p&gt;\n&lt;p&gt;要是都能这样子想了，那么当下活的如何便也不太那么要紧了，毕竟此生未结的心愿还有来世可再尝试，就如电子游戏一般，大不了退出重来一次就是。如此，即使这辈子混的不好被历史遗忘了，下辈子小心点做几个漂亮的事件儿，也就不妄为人一次。&lt;/p&gt;\n&lt;p&gt;可是作为唯物主义者，绝大多数人都相信，生命只有一次，每人一票，过后不补。也即是，无论是皇帝老儿太监宫女，还是男子女子君子小人，每个人都只有那么短短的一辈子，无论这辈子过的好坏，时间到了都得一股脑的停了吃喝拉撒喜怒哀乐，安安静静的躺在哪里告别人生，剩下的还得交给历史来筛捡。&lt;/p&gt;\n&lt;p&gt;那么再回到开头的问题，既然人生匆匆，除了那些有幸被历史选中的人以外，剩下的被历史遗忘的人，活着到底是为了什么，又或者这些默默无闻的人活着是为了做些什么。&lt;/p&gt;\n&lt;p&gt;他们的曾经和我们一样有些属于自己的生活，但当生命逝去，除了熟识的人偶尔还能记起与他共有的某些岁月外，对于大多数人来说，这个人的死就像他从未存在过一般自然，时间很快就过去，这些默默无闻的人随即在历史的洪流中淹没。&lt;/p&gt;\n&lt;p&gt;我曾亲身经历过几次这样的事情，昨天还熟悉的身影，到了今天就成了土堆里的一口棺材，墙上的一张相纸。这些人和他们曾经那么鲜活的生命，都在此刻戛然而止。也许目前还会有人偶尔想起这些人，连带着他们活着的时候所说过的某句话，说开过的某个玩笑，但当我们这些熟悉他的人也和他一样，成了墙上的一张纸地头的一抔土后，他们的存在大概也就随之而去了吧。&lt;/p&gt;\n&lt;p&gt;这时我才明白，他们即就是我们。&lt;/p&gt;\n&lt;p&gt;既然最终难逃一死，为什么还要默默无闻的耗尽这一生，不留痕迹。当官的有句话大意是“不作为即是犯罪”，人生一世又何尝不是如是呢？空耗这么美好的时光，却是赤条条的来光溜溜的去，没有一丝半点的改变，又何尝不像是凭空耍了一场流氓，拍拍屁股走人呢？&lt;/p&gt;\n&lt;p&gt;那么由此看来，历史上耍流氓的人倒不在少数。随波逐流，人云亦云，麻木不仁，没有在深夜仰望星空的人，都是在心安理得的耍着流氓。&lt;/p&gt;\n&lt;p&gt;于是乎，被遗忘似乎是对待流氓最好的处理。&lt;/p&gt;\n&lt;p&gt;2015-10-23 1:21&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-10-23 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:22:07&quot;],&quot;timestamp&quot;:[0,1445529600000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者通过仰望星空，思考了历史与个人的关系。历史只记住了极少数叱咤风云的人物，而绝大多数普通人则如空气般被遗忘。作者探讨了生命的唯一性和不可逆性，认为既然生命只有一次，就不应默默无闻地虚度光阴。被遗忘是对那些随波逐流、麻木不仁的“流氓”最好的惩罚，而真正活着的人应当在有限的生命中留下自己的痕迹。&quot;],&quot;summaryEn&quot;:[0,&quot;Looking up at the starry sky, the author reflects on the relationship between history and individuals. History only remembers a very few influential figures, while the vast majority of ordinary people are forgotten like air. The author explores the uniqueness and irreversibility of life, arguing that since life happens only once, one should not spend it in obscurity. Being forgotten is the best punishment for those \&quot;hooligans\&quot; who drift with the tide and are numb, while those who truly live should leave their mark in their limited lives.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-10-23.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;f43661cd&quot;],&quot;title&quot;:[0,&quot;食议&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;63ba6ddb&quot;],&quot;title&quot;:[0,&quot;夜&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island><astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.DqizqNHL.js" component-export="default" renderer-url="/imissyou/_astro/client.Dhu_hMGW.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
