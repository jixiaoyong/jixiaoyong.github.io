终于在我踏入家门的那一刻被捅爆，接着便是与日俱增的数字和各种情绪——哪怕是在北方遥远的山村里，一股特殊的味道也在慢慢弥散开来。很多事被打乱，所谓阴差阳错也不过如此而已。&lt;/p&gt;\n&lt;p&gt;经历了最为特殊且漫长的春节之后，在家充好电后的我又踏入南下的人海之中，灰蒙蒙的天，偌大的马路上只有洒水车朝天空喷撒着雾化消毒液，留下身后空荡荡的柏油路消失在不知是雨还是雾的虚无之中。&lt;/p&gt;\n&lt;p&gt;世界好像变了样。&lt;/p&gt;\n&lt;h2&gt;三&lt;/h2&gt;\n&lt;p&gt;今年年初的时候，好像是上帝开了个玩笑，去年此时的事情换了人换了脚本又徐徐展开，我恍惚于这种时间漩涡的雷同，纠结于确定与否定之过往，这使我不知所措了。暴风雨过后，到底是什么发生了变化呢？&lt;/p&gt;\n&lt;p&gt;我，不知道。&lt;/p&gt;\n&lt;p&gt;拖延。拖延。还是拖延。&lt;/p&gt;\n&lt;p&gt;比预想的要晚的多，缺少破釜沉舟的魄力，多得是山穷水尽疑无路。&lt;/p&gt;\n&lt;h2&gt;四&lt;/h2&gt;\n&lt;p&gt;一个。两个。三个。&lt;/p&gt;\n&lt;p&gt;每一秒，指针划过表盘，发出清脆的机械声，倒计时开始了。&lt;/p&gt;\n&lt;p&gt;从最开始只是想试试，到后来多次争取，人的意志总是随着见识、阅历变化。&lt;/p&gt;\n&lt;p&gt;外部的环境比预期的好太多，一切好像没有受到任何影响一般，从最开始的忐忑不安，到后来有恃无恐，这期间最多的恐怕只能是惊诧，这一切又岂止是一句“卧槽”能够表达的。&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;你不出来走走，还以为这是全世界&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;这是三年前毕业时，我在朋友圈发的话，最近一个月以来的经历，显然让我对这句话又有了全新的认知。&lt;/p&gt;\n&lt;h2&gt;五&lt;/h2&gt;\n&lt;p&gt;最近一个月做了什么？面试，面试，还是面试。&lt;/p&gt;\n&lt;p&gt;见过几十号人的小作坊，也进过上亿资金的上市公司，但一切都和两年前的境遇有天壤之别。大约花了一周时间写好简历，在 boss、智联、拉钩等平台更新以后，各种邀约过来，电话、视频、现场，但面试完之后再无下文，这种境遇使我自我怀疑到关闭简历可见，打算再闭关一个月。&lt;/p&gt;\n&lt;p&gt;转机出现在五月，现在我仍然很感激那两家公司，他们是我在一个周五下午去面试的，交谈甚欢，但答复依然是等通知。那天我在海边坐了很久，看着海水激荡着碎花拍打在沙滩上，来来往往的人群，夜幕下，对岸一排排高楼迷散在一片水雾之中。&lt;/p&gt;\n&lt;p&gt;一家，两家，三家，五月开始后的第一个工作日，转机来了。那个“LUCK 周五”的双黄蛋给了我莫大的勇气与底气，接下来这几周的时间，各种形式的面试与 offer 接踵而来，单单通话时长这一项就超过了之前一年的总和。&lt;/p&gt;\n&lt;p&gt;我是不幸的，眼界与阅历限制了我想象的极限，也框制了我的谈判能力。我无疑又是幸运的，收到的 offer 一次又一次冲击着我的想象，也在考验着我对自己能力的信心。&lt;/p&gt;\n&lt;h2&gt;六&lt;/h2&gt;\n&lt;p&gt;最后，如果对这段时间做个总结的话，“LUCK 周五”让我有了继续下去的动力，而东莞某厂则让我心动之余也有了更为大胆的想法，第一次得到了心目中大厂的认可，对我来说意义非凡，可惜还是在待遇方面不太满意，最终接受了深圳一家互联网支付公司的 offer。&lt;/p&gt;\n&lt;p&gt;如果再以年为单位向前扳动齿轮，入职的第一家公司让我一窥规模化生产的全貌，第二家公司则使我实现了从家养到野外求生的转变，虽无专一，技咸熟尔。接下来，又会是怎样的旅程呢？&lt;/p&gt;\n&lt;p&gt;那么，开始下一程吧。&lt;/p&gt;\n&lt;p&gt;定个小目标——先过了试用期再说。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2020-05-18 18:19:13&quot;],&quot;updated&quot;:[0,&quot;2024-01-02 21:30:55&quot;],&quot;timestamp&quot;:[0,1589797153000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[[0,&quot;Blog&quot;]]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者回顾了2020年这段特殊时期的求职经历。从年初的疫情爆发、公司裁员，到之后的迷茫与焦虑，再到五月份的转机和最终入职心仪的大厂。文章记录了作者在动荡环境下的心路历程和职业成长。&quot;],&quot;summaryEn&quot;:[0,&quot;The author reviews their job hunting experience during the special period of 2020. From the outbreak of the epidemic and company layoffs at the beginning of the year, to the subsequent confusion and anxiety, and then to the turning point in May and finally joining a desired big company. The article records the author&#39;s mental journey and career growth in a turbulent environment.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/好险，差点就要人在东莞漂泊十年.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;94a46e7b&quot;],&quot;title&quot;:[0,2020]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;1c5ec7e6&quot;],&quot;title&quot;:[0,&quot;仰天大笑出门去&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.BgsxrJFb.js" component-export="default" renderer-url="/imissyou/_astro/client.DpoKbfDq.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
