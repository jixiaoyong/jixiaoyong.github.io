          metaThemeColor.setAttribute(

            currentTheme === "dark" ? "#111111" : "#ffffff",
          );
        }
      })();

、奉献、牺牲等等种种情感，是会被时间冲淡泯然于历史洪流之中，还是仍旧会栩栩如生跃然纸上直击后来者的心房？&lt;/p&gt;\n&lt;p&gt;互联网是个好东西，天然的为了记录和分享而生。作为正在经历着这场巨变的人们，天然的有责任记录时下发生的事情，特别是那些被时代英雄的事迹光芒所遮盖住了的点滴。然而这一年，大多数时候，只是庸庸碌碌的奔波着生活的琐事，既没时间也没能力去履行这样的义务，不过但愿幸好一定有人在不远处记录着这一切，先在这里感谢他们为普通人注脚，也让平淡的生活多了一些意义。&lt;/p&gt;\n&lt;p&gt;回想起年初那会儿，随身戴着一只用了快一周的 N95 口罩，在白色的消毒喷雾中，一头扎进南下的万里长途之中，耳边眼前尽是每日递增的数字与各类情绪，世界会好的，可是不知道有多少人能够撑到那个时候。&lt;/p&gt;\n&lt;p&gt;当下已经是 2020 年末尾，疫苗也已经开始接种，想起年初时玩的一场《瘟疫公司》的游戏，还好，情况不是太糟。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://jixiaoyong.github.io/images/20201231204957.jpg\&quot; alt=\&quot;GAME OVER\&quot;&gt;&lt;/p&gt;\n&lt;h2&gt;二&lt;/h2&gt;\n&lt;p&gt;今年 6 月份的时候，在做了一番对比之后，做了一个不算困难的&lt;a href=\&quot;https://jixiaoyong.github.io/imissyou/posts/84aada62/\&quot;&gt;选择&lt;/a&gt;，跳槽到现在的公司。&lt;/p&gt;\n&lt;p&gt;更远的上班地点，更挤的上班交通，甚至更久的上班时间。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://jixiaoyong.github.io/images/20201231205217.png\&quot; alt=\&quot;上班时间越来越长\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;回想来到这里三年时间，换了三家公司、搬家无数次，从关外到关内，却很难找到一个真正的落脚之地。在这期间，身边人影匆匆，嘈杂喧哗，恍若掉进兔子洞中，千变万化，虽置身其中，却虚幻如镜花水月。&lt;/p&gt;\n&lt;p&gt;毕业至今，已有三年矣，从误打误撞到逐渐入门，再到冥冥之中无形横曳在这个行业背后的倒计时诅咒，未来，会是怎样呢？&lt;/p&gt;\n&lt;h2&gt;三&lt;/h2&gt;\n&lt;p&gt;子在川上曰，逝者如斯夫，不舍昼夜。&lt;/p&gt;\n&lt;p&gt;年初的时候，计划着一个尝试，因为突然严重起来的疫情不得不中止，不知是好是坏，在接下来的这一年中，类似的问题一有机会就会冒出来，三番五次，日新月异，甚至于即使难得有机会去思索的时候，已然无法分清令人纠结的到底是问题还是问题本身的存在。那么当下再去回忆之前作出的种种选择以及当时的心理的时候，也就很难真正的体会当昨日的心境，此时再去强行审判过去的自己，也就未免显得有点愚蠢了。&lt;/p&gt;\n&lt;p&gt;年初的时间过得有多漫长，下半年的时间就过得有多匆忙，以至于现在想要回顾整个 2020 年的时候，很难找到什么值得专门拎出来谈一谈的细节。但不管怎么样，这一年终究是要过去了，鲁迅门前有两棵枣树，2020 年亦有两个 20，一个 20 做出了过去的种种选择，另一个 20 为过往的选择所缔造，也为明天做出下一个选择。&lt;/p&gt;\n&lt;p&gt;昨日的选择成就当下的处境，当下即是过往选择的集合，选择即是全部的权利与责任。&lt;/p&gt;\n&lt;h2&gt;〇&lt;/h2&gt;\n&lt;p&gt;明天早上，太阳依旧升起，窗边的花也该浇浇水了。&lt;/p&gt;\n&lt;p&gt;2020 年结束了，谢谢你，拜拜。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://jixiaoyong.github.io/images/20201231220911.png\&quot; alt=\&quot;GoodBye 2020\&quot;&gt;&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2021-01-01 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:26:36&quot;],&quot;timestamp&quot;:[0,1609430400000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[[0,&quot;岁岁今朝&quot;]]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者回顾了2020年，这一年被疫情笼罩。文章记录了疫情初期的恐慌与感动，以及作者在这一年中的工作变动和生活感悟。作者感叹时间的流逝和选择的重要性，认为当下是过往选择的集合。尽管这一年充满了困难和不确定性，作者仍以积极的态度告别2020，迎接新的一年。&quot;],&quot;summaryEn&quot;:[0,&quot;The author reviews 2020, a year shrouded in the pandemic. The article records the panic and touching moments at the beginning of the pandemic, as well as the author&#39;s job changes and life insights during the year. The author sighs at the passage of time and the importance of choices, believing that the present is a collection of past choices. Despite the difficulties and uncertainties of the year, the author bids farewell to 2020 with a positive attitude and welcomes the new year.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2020.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;9a3bcdf8&quot;],&quot;title&quot;:[0,&quot;PEOPLE! PEOPLE! PEOPLE!&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;84aada62&quot;],&quot;title&quot;:[0,&quot;好险，差点就要人在东莞漂泊十年&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.BgsxrJFb.js" component-export="default" renderer-url="/imissyou/_astro/client.DpoKbfDq.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
