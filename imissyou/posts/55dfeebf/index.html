，这毕业的时节，这离别的季节。毕业即是离别，是一群人的最后狂欢。青春，友情，爱情都随着一杯杯咕咚灌下的啤酒混合、发酵，最终在一声声响嗝中，弥散到昏黄的白炽灯光中。也许明日就要天各一方，也许今后就老死不往来，又何妨今日且醉且歌。无论多么迟钝的人，都会在这毕业的时节多少有一些离别的伤感。&lt;/p&gt;\n&lt;p&gt;倏忽想起了旧时的玩伴，曾经多少岁月蹉跎，现下也早已各奔天涯许多年。人在时间的面前总是渺小而无力，多情的人尤为时间所累。&lt;/p&gt;\n&lt;p&gt;天色忽然暗下来，白色的雨点击打着叶片，又一场雨终于来了。&lt;/p&gt;\n&lt;p&gt;明天，该是个晴天吧。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2017-02-15 17:02:15&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:26:20&quot;],&quot;timestamp&quot;:[0,1487149335000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者描写了夏日的雨季和毕业季的离别氛围。雨水充沛的七月，伴随着毕业的狂欢与感伤。作者感叹于时间的流逝和人力的渺小，回忆起旧时玩伴和各奔天涯的无奈。文章以雨过天晴的期许作结，寄托了对未来的希望。&quot;],&quot;summaryEn&quot;:[0,&quot;The author describes the rainy season in summer and the parting atmosphere of the graduation season. July, full of rain, is accompanied by the carnival and sentimentality of graduation. The author sighs at the passage of time and the insignificance of human power, recalling old playmates and the helplessness of going separate ways. The article ends with the expectation of clearing up after the rain, pinning hope on the future.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2017-02-15.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;8fecf490&quot;],&quot;title&quot;:[0,&quot;在这城市的车水马龙&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;ce99c7c0&quot;],&quot;title&quot;:[0,&quot;小镇来雪&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island><astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.DqizqNHL.js" component-export="default" renderer-url="/imissyou/_astro/client.Dhu_hMGW.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
