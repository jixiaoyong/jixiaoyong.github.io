能有更多的时间，以便他能完成堆积如山的工作。&lt;/p&gt;\n&lt;p&gt;于是，这时候有个闲人在某次祭祀上面，向神祈求，希望给自己一些吃的，哪怕以后少活些时日。&lt;/p&gt;\n&lt;p&gt;这时，两类人终于有了相契的诉求，他们一起祈求神，忙人希望用自己的成果，换取一些时间，而闲人则希望能出卖一部分自己的时间，好换取些吃的以便活下去。&lt;/p&gt;\n&lt;p&gt;神，自然是不答应的。他创立万物，设计时间，又岂能让万物自由买卖时间——&lt;strong&gt;时间既是他们的生命&lt;/strong&gt;！&lt;/p&gt;\n&lt;p&gt;然而，神不是万能的，而人的思想是无穷的。&lt;/p&gt;\n&lt;p&gt;终于在一次百无聊赖的下午，一个闲人发现，如果他对着海贝吹口气的话，他就会失去一段记忆，即失去了一段儿时间，而当他试着把海贝口对着自己的耳朵击打的时候，他又发现失去的那些时间又回来了。于是他欣喜的把这个发现告诉朋友，朋友又告诉朋友的朋友。直到有一个人发现可以用海贝把自己的时间，转输给另一个人，于是闲人们找到了忙人，忙人们找到了闲人。&lt;/p&gt;\n&lt;p&gt;人们用&lt;strong&gt;海贝承载着时间，交换着各自所需&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;于是忙人的工作成果便可以换取时间，闲人的时间便可换取包括食物在内的成果。这极大地刺激了人类的发展。&lt;/p&gt;\n&lt;p&gt;随着人类的进步，海贝已经无法满足流通的需求，于是日后逐渐出现了铜板、金、银，直到现在的纸币，甚至于像更超前的比特币。&lt;/p&gt;\n&lt;p&gt;于是，人便发现了时间的载体。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-12-08 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2024-06-05 11:33:50&quot;],&quot;timestamp&quot;:[0,1449504000000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[[0,&quot;&#39;一派胡言&#39;&quot;]]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;一篇关于金钱起源的寓言故事。作者构想了一个世界，忙人需要时间，闲人需要生存，于是神允许用海贝作为载体交换“时间”（即生命），从而诞生了货币。&quot;],&quot;summaryEn&quot;:[0,&quot;A fable about the origin of money. The author conceives a world where busy people need time and idle people need survival, so God allows seashells to be used as a carrier to exchange \&quot;time\&quot; (i.e., life), thus giving birth to currency.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/钱的由来.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;b4cc77f1&quot;],&quot;title&quot;:[0,&quot;挟裹着过往前行&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;8c989346&quot;],&quot;title&quot;:[0,&quot;有你们，挺好的&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.BgsxrJFb.js" component-export="default" renderer-url="/imissyou/_astro/client.DpoKbfDq.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
