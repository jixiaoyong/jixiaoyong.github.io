uid="Z1GupeB" component-url="/imissyou/_astro/PostDetailWrapper.NiikyhH1.js" component-export="default" renderer-url="/imissyou/_astro/client.PWbBjEwf.js" props="{&quot;postId&quot;:[0,&quot;1492843a&quot;],&quot;initialPost&quot;:[0,{&quot;id&quot;:[0,&quot;1492843a&quot;],&quot;title&quot;:[0,&quot;《无声告白》读书笔记&quot;],&quot;excerpt&quot;:[0,&quot;[图片] 詹姆斯的女儿死了。 人们在湖底发现她时，她的肢体已经浮肿得像发酵过头的面团，不敢有稍微的触碰。...&quot;],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;img src=\&quot;https://jixiaoyong.github.io/images/20200407230646.png\&quot; alt=\&quot;《无声告白》的封面\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;詹姆斯的女儿死了。\n人们在湖底发现她时，她的肢体已经浮肿得像发酵过头的面团，不敢有稍微的触碰。&lt;/p&gt;\n&lt;p&gt;詹姆斯一生最大的渴求就是融入周围的世界，像一个普通人一样生活，准确的说是像一个普通的白种人那样。这样的想法从他父母顶替某个不知名的“兄弟”来到大洋彼岸的美国开始生活的时候就已经深深的埋在他们的脑海里。当他的父母踏上美洲大陆时是如此，当他交上入学测试卷时如此，当他吃着母亲从食堂带回来的剩饭时也是如此，甚至当父母亲依次逝去的时候更是如此。&lt;/p&gt;\n&lt;p&gt;直到玛丽琳闯进他的世界的那个下午，这一切似乎才有了改变。以前所有的一切的沉默，担惊受怕和自我保护似乎都不需要在面前这个可爱的白人女孩面前保留。伟大的爱情足以让他们无视玛丽琳母亲的劝诫，结婚、生子。我想，对于詹姆斯来说，玛丽琳不止是他的爱人，更是他的救世主——一个博爱的果敢的承认詹姆斯作为一个人存在的主，他太想成为一个合群的普通人了。&lt;/p&gt;\n&lt;p&gt;玛丽琳的确知道母亲希望自己能够好好的上家政课，希望自己能够学会烹饪，希望自己能够有一个哈佛的老公。但这一切都不是玛丽琳想要的，每次吃饭时看到母亲熟练的用满是洗洁精味的双手熟练的解下围裙时，她都在心里默默的告诫自己千万不能让自己的一生就这样度过，她应该有自己的生活，一个自己选择的生活。但最终，和詹姆斯结婚后，她还是重复起了母亲曾经的生活。&lt;/p&gt;\n&lt;p&gt;于是参加完母亲的葬礼之后的某一天，她丢下去学校教课的詹姆斯，还有留在家里的她的一对儿女——内斯和莉迪亚，毅然决然的带着母亲留给自己的一笔遗产和年轻时的遗憾离家出走，去找寻她曾经的梦想。汽车奔驰在柏油路上，她一定看到了曾经一次次幻想过的自己成为一名医生的梦，为此她再次拿起了搁置了七八年的课本，在狭小的出租屋里啃着一本又一部陌生又熟悉的课本。如果不是在考试之前晕倒在路上，她或许还有机会参加就要到来的考试，如果不是迷迷糊糊中对医生说出了“病人家属”的联系方式，她或许还能再为自己曾经的梦想在拼一把。然而并没有如果，当詹姆斯打开车门来到医院的那一刻，她知道自己这辈子都不可能再有机会实现她的梦想了。&lt;/p&gt;\n&lt;p&gt;然而他们还有希望，詹姆斯和玛丽琳都这样认为，至少他们还有莉迪亚，一个善于交际，求学上进的女儿，一切都如他们希望的那样发展。&lt;/p&gt;\n&lt;p&gt;莉迪亚知道自己并不喜欢母亲送给自己的人体彩绘和医用听诊器，正如她不喜欢父亲送给自己的教人如何结识朋友的书，然而她知道自己应该这样做。她应该这样做，妈妈才不会又像上次那样抛下他们和父亲独自离去；她应该这样做，妈妈才充满期待的眼睛才不会被失望的泪水淹没；她应该这样做，爸爸才会放心的露出轻松的微笑；只有这样做，她这个家才能勉强维持而不至于再次崩塌。这一切都只是她应该做，她觉得父母觉得她应该就这样做，她应该是父母那个无法实现的梦想。&lt;/p&gt;\n&lt;p&gt;内斯和汉娜很多时候在家里的时间是看着父母亲围着莉迪亚转。在内斯宣布想成为航天员是如此，在内斯获得哈佛的录取通知书时如此，在内斯结束在哈佛的提前访学后回到家时还是如此，而汉娜，几乎就没有在父母的视野里出现过——至少当她躲进厨房桌子底下时是这样期待的。这个家都是围着莉迪亚转的，至少有一半的家是围着莉迪亚转的。&lt;/p&gt;\n&lt;p&gt;然而这一切都在莉迪亚离开家门，在一片宁静中迈向湖水的那天晚上被彻底改变。&lt;/p&gt;\n&lt;p&gt;莉迪亚死了，沉入深深的冰冷的湖底，就像詹姆斯和玛丽琳的梦想一样，被撕裂的体无完肤。一切都结束了，至少玛利亚和詹姆斯寄托（或者说强加）在莉迪亚身上的一切自己未曾拥有的梦想都被冰冷的湖水淹没。&lt;/p&gt;\n&lt;p&gt;无论他们是否接受这一事实，他们的确失败了。就像他们的父母将自己未曾实现的梦想强加给他们一样，他们把自己所有未曾实现的一切都强加在莉迪亚身上，然后眼睁睁看着这个梦破碎，陨灭。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-10-11 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-03-19 13:00:24&quot;],&quot;timestamp&quot;:[0,1444492800000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;这是一篇关于《无声告白》的读书笔记。文章讲述了詹姆斯和玛丽琳夫妇将自己未实现的梦想——融入白人社会和成为医生——强加给女儿莉迪亚，导致莉迪亚在巨大的压力下最终走向毁灭的故事。作者深刻剖析了家庭中因沟通缺失和期望错位而酿成的悲剧，指出父母将自身遗憾转嫁给子女的残酷现实。&quot;],&quot;summaryEn&quot;:[0,&quot;This is a reading note on \&quot;Everything I Never Told You\&quot;. The article tells the story of James and Marilyn, who imposed their unfulfilled dreams—integrating into white society and becoming a doctor—on their daughter Lydia, leading to her eventual destruction under immense pressure. The author deeply analyzes the tragedy caused by the lack of communication and misplaced expectations in the family, pointing out the cruel reality of parents transferring their regrets to their children.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-10-11.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;63ba6ddb&quot;],&quot;title&quot;:[0,&quot;夜&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;9d7a36e7&quot;],&quot;title&quot;:[0,&quot;变化&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>
