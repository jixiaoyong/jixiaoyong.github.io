有了拥有自己的手机的权限，于是在大哥的陪伴下购买了我的第一部手机：触摸屏，摄像功能，全键盘，能上网。最重要的是手机上面除了电话短信功能以外还有 QQ，一种听说过很久但是一只犹抱琵琶半遮面的社交软件。虽然这部手机在半年后莫名坏掉然后换来的手机又在半年后莫名坏掉，但仍不能掩盖他作为我的第一步手机对我产生的巨大影响。&lt;/p&gt;\n&lt;p&gt;在半明半暗的用手机上网后，我发现自己不小心闯进了一个神奇广袤的世界。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2015-11-09 00:00:00&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:22:23&quot;],&quot;timestamp&quot;:[0,1446998400000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者回顾了自己接触互联网和社交网络的历程。从2010年拥有第一个QQ号和QQ空间开始，经历了对网吧的误解与向往，到高中拥有第一部手机后真正进入互联网世界。文章记录了作者初次触网时的兴奋与新奇，以及互联网如何填补了现实生活中的鸿沟，成为其生命中重要的一部分。&quot;],&quot;summaryEn&quot;:[0,&quot;The author reviews their journey of encountering the internet and social networks. Starting from owning their first QQ number and QQ Zone in 2010, they experienced misunderstandings and yearning for internet cafes, until they truly entered the internet world after owning their first mobile phone in high school. The article records the author&#39;s excitement and novelty when first accessing the internet, and how the internet filled the gap in real life and became an important part of their life.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-11-09.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;8c989346&quot;],&quot;title&quot;:[0,&quot;有你们，挺好的&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;f43661cd&quot;],&quot;title&quot;:[0,&quot;食议&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  <astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.BgsxrJFb.js" component-export="default" renderer-url="/imissyou/_astro/client.DpoKbfDq.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island>  </body></html>
