3-12-30 14:22:19&quot;],&quot;timestamp&quot;:[0,1445702400000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;作者探讨了饮食与社交的关系。认为在社交场合中，食物的优劣次于人物的重要性。为了宾主尽欢，参与者往往需要妥协，甚至遵循“勿扰勿慵勿语”的原则。作者指出，饮食本是私人的事情，但在社交语境下变得复杂，建议在明确人与事之前，少参与此类饭局为妙。&quot;],&quot;summaryEn&quot;:[0,&quot;The author explores the relationship between food and social interaction. They believe that in social settings, the quality of food is secondary to the importance of the people involved. To ensure everyone enjoys themselves, participants often need to compromise, even following the principle of \&quot;do not disturb, do not be lazy, do not speak\&quot;. The author points out that eating is originally a private matter, but it becomes complicated in a social context, suggesting that it is better to participate less in such meals before the people and matters are clear.&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/2015-10-25.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;60570382&quot;],&quot;title&quot;:[0,&quot;社交--我的互联网生命简史&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;449346ca&quot;],&quot;title&quot;:[0,&quot;被遗忘的流氓们&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island><astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.GQ3uHm43.js" component-export="default" renderer-url="/imissyou/_astro/client.D-1B7NN9.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
