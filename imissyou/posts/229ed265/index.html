跑，晚归，雷雨骤至。&lt;/p&gt;\n&lt;p&gt;漆黑的夜空突然炸响一声闷雷，黄豆般的雨点刷的一声扯起一堵白茫茫的雨幕。雨水刚开始还能在地上砸出一朵朵水花，接着便消失在一滩滩水池之中，那是刚刚落地还来不及找到去处的雨水聚起的。&lt;/p&gt;\n&lt;p&gt;不时闪过的惊雷像是诸神的一场烟花秀，尖锐的白刃不时划破天际。双脚踩下去还未来得及抬起，踏空的积水便卷了过来，在身后留下两条深深的水道。&lt;/p&gt;\n&lt;p&gt;这一切并不是毫无征兆，出发前就有预报说要降雨，然而又有谁轻易相信天气预报呢？刚刚踏出家门时就隐约有些雨点，甚至天空也闪过一片雷光，又能因此打破好不容易培养起来的习惯，终日蜷缩在家中呢？&lt;/p&gt;\n&lt;p&gt;安静，凉爽，一切只不过又是一次普通的夜跑。可是这一切又太过正常，反而有些不正常，终于似乎零星有些雨点落下，于是往回奔跑吧，万一真的有雨呢？&lt;/p&gt;\n&lt;p&gt;世事的发展总是不以人的意志而转移，更何况是酝酿了这么久的暴雨——暴风雨终于来了。&lt;/p&gt;\n&lt;p&gt;躲。屋檐下，便利店里，到处搜寻着救命稻草般的庇护所。静静的等待，衣服粘在身上，汗水与雨水交融。手机提示这场雷雨还要持续两个多小时。&lt;/p&gt;\n&lt;p&gt;你知道这事情总会过去，你也知道他大概会什么时候过去，可是真正身处其中的时候，很多事情是没法只是这样等着他过去的。&lt;/p&gt;\n&lt;p&gt;外面雨越来越大，电闪雷鸣，倾盆大雨。即使知道这雨总会变小，也知道这暴风总会消寂，但当这一切正在发生的时候，是不会静静等待着他消寂的—— 暴风雨看起来马上会消失，又可能永远不会消失。&lt;/p&gt;\n&lt;p&gt;躲是躲不掉的。拿好行装，撑起雨伞，一头扎进这雨幕中，双脚泡进水中，鞋子充满水变得肥腻轻盈，斜撑着一把雨伞，像是中世纪的骑士扛着战无不胜的盾牌，让身体化为一把利刃，扎进这惨烈的暴风雨中，用舌尖舔舐每一滴雨水的味道。&lt;/p&gt;\n&lt;p&gt;雷电在头顶炸响，一条条汽车在马路游荡，红的黄的霓虹灯交融在雨幕中，高楼也失去了往日雄伟的气势隐身在无尽的夜空。一团耀眼的白光过后，不远处的树干拦腰折断，深不见底的浑水中埋藏着一个个噬人的陷阱。&lt;/p&gt;\n&lt;p&gt;虽然之前也曾经历过无数次暴风雨，却没有一次让人这样深切的感到死亡的威胁，只盼着赶快撑过去。然而举目望去，只有这来势汹汹的急雨和那无尽的夜。&lt;/p&gt;\n&lt;p&gt;天桥下，车站旁，到处是来不及避雨的人，一路除了匆匆路过的电车，唯有暴雨作伴。不能停歇，从踏出这一步开始，这一切就只能硬着头皮独自走下去，一脚一脚的踩出前行的路，找到回家的路。&lt;/p&gt;\n&lt;p&gt;不知何时雨势渐弱，淅淅沥沥。进入了繁华闹市中人流也多了起来，一对小夫妻推着孩子等着过马路，爸爸推着车子，妈妈用手遮着头，整个人却挡在推车的前面，努力为孩子挡住一片风雨。&lt;/p&gt;\n&lt;p&gt;我独撑着伞，想过去遮一把雨水，却不忍打扰这一家人。也许此时这幸福的小宝宝还不能体会到父母的爱，也还不会明白终有一天这世界没有人会在乎你，有一天没有人在乎你的哭、闹，没有人会在乎你一切的喜怒哀乐，你只能学会自己承受。到那个时候，当他再次面临今日的暴风雨，不知道他会做出怎样的选择呢？&lt;/p&gt;\n&lt;p&gt;回到家中冲个澡，窗外雨声逐渐稀疏。也许当时再多避一会儿就能安然回家，也许当时不出门便无需经历这一切，可是人生哪有那么多假设呢，如果再次返回到当初的场景，以当时的认知仍然会做出相同的选择吧。&lt;/p&gt;\n&lt;p&gt;一切看似偶然，却又都是必然，只是在这一场突如其来的暴风雨中，经历了什么？又学到了什么？将来再次面对类似的选择时又该做出怎样的选择？&lt;/p&gt;\n&lt;p&gt;我，不知道。&lt;/p&gt;\n&lt;p&gt;也许只有当暴风雨再次来临的时候，这一切才会有答案。&lt;/p&gt;\n&lt;p&gt;那么，让暴风雨来的更猛烈些吧。&lt;/p&gt;\n&lt;p&gt;&lt;br/&gt;&lt;br/&gt;&lt;br/&gt;&lt;/p&gt;\n&lt;p&gt;PS.文中一段话引自一位演员的采访录中，触动很深，为了不影响全文体验，不具体指明。如有不妥敬请指出。&lt;/p&gt;\n&quot;],&quot;date&quot;:[0,&quot;2019-04-11 22:42:02&quot;],&quot;updated&quot;:[0,&quot;2023-12-30 14:32:39&quot;],&quot;timestamp&quot;:[0,1554993722000],&quot;readTime&quot;:[0,&quot;1&quot;],&quot;tags&quot;:[1,[[0,&quot;Blog&quot;]]],&quot;headerImage&quot;:[0],&quot;summaryZh&quot;:[0,&quot;记叙了一次夜跑时遭遇暴风雨的经历。作者生动描写了雷雨骤至的场景和人们在雨中的慌乱与坚持，并由此引申出对人生风雨的思考：面对避无可避的困难，唯有硬着头皮前行。&quot;],&quot;summaryEn&quot;:[0,&quot;\&quot;Recounts an experience of encountering a thunderstorm during a night run. The author vividly describes the sudden arrival of the thunderstorm and the panic and persistence of people in the rain, drawing a reflection on the storms of life: when facing inevitable difficulties, one can only brace oneself and move forward.\&quot;&quot;],&quot;abstract&quot;:[0],&quot;message&quot;:[0],&quot;isEncrypted&quot;:[0,false],&quot;published&quot;:[0,true],&quot;filePath&quot;:[0,&quot;/source/_posts/暴风雨.md&quot;],&quot;shortcodes&quot;:[1,[]],&quot;author&quot;:[0,{&quot;name&quot;:[0,&quot;残桐落叶&quot;],&quot;avatar&quot;:[0,{&quot;light&quot;:[0,&quot;assets/avatar-light.webp&quot;],&quot;dark&quot;:[0,&quot;assets/avatar-dark.webp&quot;]}]}],&quot;prev&quot;:[0,{&quot;id&quot;:[0,&quot;4640e63a&quot;],&quot;title&quot;:[0,&quot;坚持一年试试看&quot;]}],&quot;next&quot;:[0,{&quot;id&quot;:[0,&quot;2102181c&quot;],&quot;title&quot;:[0,&quot;Getting Better&quot;]}]}]}" ssr client="only" opts="{&quot;name&quot;:&quot;PostDetailWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island><astro-island uid="Z2s6hqd" component-url="/imissyou/_astro/FooterWrapper.DqizqNHL.js" component-export="default" renderer-url="/imissyou/_astro/client.Dhu_hMGW.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FooterWrapper&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
