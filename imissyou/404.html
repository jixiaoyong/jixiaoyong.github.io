<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 亮色主题 */
    body.light {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #2c3e50;
    }

    /* 暗色主题 */
    body.dark {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
    }

    .loading-container {
      text-align: center;
      padding: 2rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      min-width: 300px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.5rem;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-subtext {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* 响应式设计 */
    @media (max-width: 480px) {
      .loading-container {
        min-width: 280px;
        padding: 1.5rem;
      }

      .spinner {
        width: 50px;
        height: 50px;
      }

      .loading-text {
        font-size: 1.1rem;
      }

      .loading-subtext {
        font-size: 0.85rem;
      }
    }
  </style>
  <script>
    // 检测系统主题偏好
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.body.classList.add(prefersDark ? 'dark' : 'light');

    // 检测浏览器语言
    const lang = navigator.language || navigator.userLanguage;
    const isChinese = lang.startsWith('zh');

    // 设置文本内容
    const messages = {
      zh: {
        title: '页面跳转中...',
        subtitle: '正在为您加载页面'
      },
      en: {
        title: 'Redirecting...',
        subtitle: 'Loading your page'
      }
    };

    const text = isChinese ? messages.zh : messages.en;

    // GitHub Pages Hash 路由重定向解决方案
    // 当用户直接访问一个非 hash 路由（如 /imissyou/about）时，GitHub Pages 会返回 404
    // 这个脚本会截取路径信息，并重定向到 index.html 的 hash 路由
    
    // 获取完整路径（移除末尾的斜杠）
    let fullPath = location.pathname;
    if (fullPath.endsWith('/') && fullPath.length > 1) {
      fullPath = fullPath.slice(0, -1);
    }
    
    // 提取基础路径后的部分（/imissyou/posts/123 -> /posts/123）
    const baseUrl = (location.pathname.match(/^\/[^\/]+/) || [''])[0]; // 获取 /imissyou
    const routePath = fullPath.replace(baseUrl, ''); // 获取 /posts/123 或 /about
    
    // 构建 hash URL
    // 如果有路由路径，则重定向到 index.html#/路径
    // 否则重定向到 index.html
    const targetUrl = baseUrl + '/' + (routePath ? '#' + routePath : '');
    
    // 重定向到目标 URL，保留 query 参数
    location.replace(targetUrl + (location.search || ''));
  </script>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text" id="title">Redirecting...</div>
    <div class="loading-subtext" id="subtitle">Loading your page</div>
  </div>
  <script>
    // 动态设置文本（在页面加载后）
    document.getElementById('title').textContent = text.title;
    document.getElementById('subtitle').textContent = text.subtitle;
  </script>
</body>
</html>
