    <!-- SPA 路由恢复脚本 (用于 GitHub Pages) -->
    <script>
      // 这个脚本必须在应用加载之前执行
      // 它会检查 sessionStorage 中是否有重定向路径（由 404.html 设置）
      // 如果有，就使用 history.replaceState 恢复正确的 URL
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect && redirect !== '/') {
          sessionStorage.removeItem('redirect');
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

  <body class="antialiased transition-colors duration-300 bg-white dark:bg-dark-bg text-gray-900 dark:text-dark-text">
    <div id="root">
      <!-- Skeleton Screen for Initial Load -->
      <style>
        .skeleton-wrapper {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .skeleton-header {
          height: 64px;
          border-bottom: 1px solid #f2f2f2;
          display: flex;
          align-items: center;
          padding: 0 24px;
          max-width: 100%;
          margin: 0 auto;
          box-sizing: border-box;
        }
        .skeleton-header-content {
          max-width: 896px;
          width: 100%;
          margin: 0 auto;
          display: flex;
          align-items: center;
        }
        .skeleton-logo {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background-color: #f2f2f2;
          margin-right: 12px;
          background-image: url('/imissyou/assets/me.jpeg');
          background-size: cover;
          background-position: center;
        }
        .skeleton-site-title {
          font-weight: 700;
          font-size: 20px;
          color: #292929;
          letter-spacing: -0.5px;
        }
        .skeleton-content {
          max-width: 672px;
          margin: 48px auto;
          padding: 0 24px;
          box-sizing: border-box;
        }
        .skeleton-post {
          margin-bottom: 64px;
        }
        .skeleton-post-title {
          width: 70%;
          height: 32px;
          background-color: #f2f2f2;
          border-radius: 4px;
          margin-bottom: 16px;
          animation: pulse 1.5s infinite ease-in-out;
        }
        .skeleton-post-meta {
          width: 40%;
          height: 14px;
          background-color: #f2f2f2;
          border-radius: 4px;
          margin-bottom: 24px;
          animation: pulse 1.5s infinite ease-in-out;
          animation-delay: 0.1s;
        }
        .skeleton-post-text {
          width: 100%;
          height: 16px;
          background-color: #f2f2f2;
          border-radius: 4px;
          margin-bottom: 12px;
          animation: pulse 1.5s infinite ease-in-out;
          animation-delay: 0.2s;
        }
        .skeleton-loading-text {
          text-align: center;
          margin-top: 40px;
          color: #757575;
          font-size: 14px;
          animation: fade 2s infinite;
        }
        @keyframes pulse {
          0% { opacity: 0.6; }
          50% { opacity: 1; }
          100% { opacity: 0.6; }
        }
        @keyframes fade {
          0% { opacity: 0.4; }
          50% { opacity: 1; }
          100% { opacity: 0.4; }
        }
        @media (prefers-color-scheme: dark) {
          body { background-color: #111; }
          .skeleton-header { border-bottom-color: #292929; }
          .skeleton-site-title { color: #e5e5e5; }
          .skeleton-logo { background-color: #333; border: 1px solid #333; }
          .skeleton-post-title, .skeleton-post-meta, .skeleton-post-text { background-color: #333; }
          .skeleton-loading-text { color: #a3a3a3; }
        }
      </style>
