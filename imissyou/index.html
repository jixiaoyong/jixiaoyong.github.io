    <style>
      /* 重置和基础样式 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        /* Lora for English, FZBoYaFangKanSongS for Chinese, system fallbacks */
        font-family: "Lora", "FZBoYaFangKanSongS", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
      }

      /* 加载容器 - 独立于 #root，遮盖整个页面 */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh; /* Ensure full viewport height */
        background: #ffffff;
        display: flex;
        flex-direction: column;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
        overflow: hidden; /* Prevent scrolling */
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* 骨架屏头部 - 匹配 Header.tsx 布局 */
      .skeleton-header {
        height: 64px; /* h-16 = 64px */
        border-bottom: 1px solid #f2f2f2;
        display: flex;
        align-items: center;
        padding: 0 16px; /* px-4 = 16px */
        box-sizing: border-box;
        position: sticky;
        top: 0;
        background: #ffffff;
        z-index: 50;
      }

      @media (min-width: 640px) {
        .skeleton-header {
          padding: 0 24px; /* sm:px-6 = 24px */
        }
      }

      .skeleton-header-content {
        max-width: 896px; /* max-w-4xl = 896px */
        width: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px; /* gap-3 = 12px */
      }

      .skeleton-logo {
        width: 32px; /* w-8 = 32px */
        height: 32px; /* h-8 = 32px */
        border-radius: 50%;
        background-color: #f2f2f2;
        -o-object-fit: cover;
           object-fit: cover;
        flex-shrink: 0;
      }

      .skeleton-site-title {
        font-family: "FZBoYaFangKanSongS", ui-serif, Georgia, serif;
        font-weight: 700;
        font-size: 18px; /* text-lg on mobile */
        color: #292929;
        letter-spacing: -0.025em; /* tracking-tight */
        /* Hide text until font loads to avoid FOUT */
        opacity: 0;
        animation: fadeIn 0s 0.1s forwards;
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @media (min-width: 640px) {
        .skeleton-site-title {
          font-size: 20px; /* text-xl on desktop */
        }
      }

      /* 骨架屏内容 - 匹配 PostList.tsx 布局 (max-w-2xl = 672px) */
      .skeleton-content {
        flex: 1;
        max-width: 672px; /* max-w-2xl = 672px */
        width: 100%;
        margin: 0 auto;
        padding: 48px 16px; /* py-12 px-4 */
        box-sizing: border-box;
        overflow: hidden; /* Prevent internal scrolling */
        display: flex;
        flex-direction: column;
      }

      @media (min-width: 640px) {
        .skeleton-content {
          padding: 48px 24px;
        }
      }

      /* Only keep 2 posts to ensure loading text is visible on screen */
      .skeleton-post {
        margin-bottom: 48px; /* Slightly reduced margin */
      }

      .skeleton-post-title {
        width: 70%;
        height: 32px;
        background-color: #f2f2f2;
        border-radius: 4px;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
      }

      .skeleton-post-meta {
        width: 40%;
        height: 14px;
        background-color: #f2f2f2;
        border-radius: 4px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
      }

      .skeleton-post-text {
        width: 100%;
        height: 16px;
        background-color: #f2f2f2;
        border-radius: 4px;
        margin-bottom: 12px;
        position: relative;
        overflow: hidden;
      }

      /* 骨架屏闪烁动画 */
      .skeleton-post-title::before,
      .skeleton-post-meta::before,
      .skeleton-post-text::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.6) 50%,
          transparent 100%
        );
        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }

      .skeleton-loading-text {
        text-align: center;
        margin-top: 40px;
        color: #757575;
        font-size: 14px;
        animation: fadeInOut 2s ease-in-out infinite;
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      /* React 应用容器初始隐藏 */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }

      #root.loaded {
        opacity: 1;
      }

      /* Dark Mode Styles - 使用 data-theme 属性 */
      [data-theme="dark"] body {
        background: #111111;
        color: #e5e5e5;
      }

      [data-theme="dark"] #loading-screen {
        background: #111111;
      }

      [data-theme="dark"] .skeleton-header {
        border-bottom-color: #292929;
        background: #111111;
      }

      [data-theme="dark"] .skeleton-site-title {
        color: #e5e5e5;
      }

      [data-theme="dark"] .skeleton-logo {
        background-color: #333;
        border: 1px solid #333;
      }

      [data-theme="dark"] .skeleton-post-title,
      [data-theme="dark"] .skeleton-post-meta,
      [data-theme="dark"] .skeleton-post-text {
        background-color: #333;
      }

      [data-theme="dark"] .skeleton-post-title::before,
      [data-theme="dark"] .skeleton-post-meta::before,
      [data-theme="dark"] .skeleton-post-text::before {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.05) 50%,
          transparent 100%
        );
      }

      [data-theme="dark"] .skeleton-loading-text {
        color: #a3a3a3;
      }
    </style>

    <script>
      // 这个脚本必须在应用加载之前执行
      (function () {
        // 1. SPA 路由恢复 (用于 GitHub Pages)
        var redirect = sessionStorage.getItem("redirect");
        if (redirect && redirect !== "/") {
          sessionStorage.removeItem("redirect");
          history.replaceState(null, null, redirect);
        }

        // 2. 初始化主题
        var localTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        var currentTheme = "light";
        if (localTheme === "dark") {
          currentTheme = "dark";
        } else if (localTheme === "light") {
          currentTheme = "light";
        } else {
          // system 或 null - 跟随系统
          currentTheme = prefersDark ? "dark" : "light";
        }

        // 设置 data-theme 属性（骨架屏和状态栏颜色都依赖这个）
        document.documentElement.setAttribute("data-theme", currentTheme);

        // 同时设置 dark class（next-themes 需要）
        if (currentTheme === "dark") {
          document.documentElement.classList.add("dark");
        }

        // 更新 theme-color meta 标签
        var metaThemeColor = document.querySelector('meta[name="theme-color"]');
        if (metaThemeColor) {
          metaThemeColor.setAttribute(
            "content",
            currentTheme === "dark" ? "#111111" : "#ffffff"
          );
        }

        // 更新 iOS 状态栏样式
        var metaAppleStatusBar = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]'
        );
        if (metaAppleStatusBar) {
          metaAppleStatusBar.setAttribute(
            "content",
            currentTheme === "dark" ? "black-translucent" : "default"
          );
        }
      })();
    </script>

  >
    <!-- 加载骨架屏 - 独立于 #root，不会被 React 覆盖 -->
    <div id="loading-screen">
      <div class="skeleton-header">
        <div class="skeleton-header-content">
          <img src="/imissyou/assets/avatar-light.webp" alt="" class="skeleton-logo" id="skeleton-logo" />

      </div>
      <div class="skeleton-content">
        <div class="skeleton-post">
          <div class="skeleton-post-title"></div>
          <div class="skeleton-post-meta"></div>
          <div class="skeleton-post-text"></div>
          <div class="skeleton-post-text" style="width: 92%"></div>
          <div class="skeleton-post-text" style="width: 85%"></div>
        </div>
        <div class="skeleton-post">
          <div class="skeleton-post-title" style="width: 60%"></div>
          <div class="skeleton-post-meta"></div>
          <div class="skeleton-post-text"></div>
          <div class="skeleton-post-text" style="width: 96%"></div>
        </div>
        <!-- Removed extra posts to ensure text visibility -->
        
        <div class="skeleton-loading-text" id="loading-text">
          Loading content...
        </div>
      </div>
      <script>
        // 根据系统语言设置加载文本
        (function () {
          var lang = navigator.language || navigator.userLanguage;
          var loadingText = document.getElementById("loading-text");
          if (loadingText && lang.startsWith("zh")) {
            loadingText.textContent = "正在加载...";
          }
        })();
      </script>
    </div>

    <!-- React 应用容器 -->
    <div id="root"></div>

    <script>
      // 当 React 应用加载完成后，隐藏骨架屏
      window.addEventListener("load", function () {
        setTimeout(function () {
          var loadingScreen = document.getElementById("loading-screen");
          var root = document.getElementById("root");

          if (loadingScreen) {
            loadingScreen.classList.add("fade-out");
            setTimeout(function () {
              loadingScreen.style.display = "none";
            }, 300);
          }

          if (root) {
            root.classList.add("loaded");
          }
        }, 100); // 短暂延迟确保 React 渲染完成
      });
    </script>
