    (function () {
        // --- Configuration ---
        const quotes = siteConfig.quotes || [];
        const loadingTextMap = {
            zh: "加载中...",
            en: "Loading...",
        };

        // --- Helpers ---
        function getLanguage() {
            // Priority 1: HTML tag (most reliable for current app state)
            if (
                document.documentElement.lang === "zh" ||
                document.documentElement.lang === "en"
            ) {
                return document.documentElement.lang;
            }
            // Priority 2: LocalStorage
            try {
                const stored = localStorage.getItem("language");
                if (stored === "zh" || stored === "en") return stored;
            } catch (e) {}
            // Priority 3: Navigator
            if (typeof navigator !== "undefined") {
                const lang = navigator.language || navigator.userLanguage;
                if (lang && lang.toLowerCase().startsWith("zh")) return "zh";
            }
            return "en";
        }

        // --- Core Update Function ---
        function updateContent() {
            const lang = getLanguage();
            const loadingTextEl = document.getElementById("loading-text");
            const quoteEl = document.getElementById("loading-quote");

            // Update Text
            if (loadingTextEl) {
                loadingTextEl.textContent =
                    loadingTextMap[lang] || loadingTextMap.en;
            }

            // Update Quote (Pick random if empty, or just translate existing if we wanted,
            // but random is better for 'freshness', though we might want to stick to same quote index to avoid jumping.
            // Let's stick to random for now, or maybe stable random based on time?
            // Actually, simply re-picking random on lang change is fine.)
            if (quoteEl && quotes.length > 0) {
                // To avoid jarring changes, maybe we can store the index?
                // But simply picking random is acceptable.
                const randomQuote =
                    quotes[Math.floor(Math.random() * quotes.length)];
                const quoteContent = randomQuote[lang] || randomQuote.en;
                if (quoteContent) {
                    quoteEl.textContent = quoteContent;
                }
            }
        }

        // --- Initialization ---
        updateContent();

        // --- Reactivity (Listen for Language Changes) ---
        // Observe changes to the <html> class or attributes (lang attribute specifically)
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (
                    mutation.type === "attributes" &&
                    mutation.attributeName === "lang"
                ) {
                    updateContent();
                }
            });
        });

        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ["lang"],
        });
    })();
