<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今天吃什么？</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>"
    />
    <link rel="stylesheet" href="styles/wechat-variables.css" />
    <link rel="stylesheet" href="styles/wechat-layout.css" />
    <link rel="stylesheet" href="styles/wechat-buttons.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <div class="container">
      <!-- 盒子容器 -->
      <div class="box-container">
        <!-- 盒子主体 -->
        <div class="box-body">
          <!-- 卡片显示区域（左侧） -->
          <div class="card-display-area">
            <div class="card-background">
              <img src="box.png" alt="背景" class="card-bg-image" />
            </div>
            <div class="card-content-wrapper">
              <div
                class="card-container"
                id="cardContainer"
                style="display: none"
              >
                <!-- 卡片将在这里动态生成 -->
              </div>
              <div class="result-card" id="resultCard">
                <div class="result-content">
                  <h2 id="resultTitle">加载中...</h2>
                  <p id="resultDescription">正在加载数据</p>
                </div>
              </div>
            </div>
          </div>

          <!-- 控制区域（右侧） -->
          <div class="control-panel">
            <!-- 标题区域 -->
            <div class="title-area">
              <h1 class="title">今天吃什么？</h1>
              <div class="current-group">
                <span id="currentGroupName">默认组合</span>
                <button class="change-group-btn" onclick="showGroupSelector()">
                  切换
                </button>
              </div>
            </div>

            <!-- 控制按钮 -->
            <div class="control-area">
              <div class="button-container">
                <button class="start-btn" id="startBtn">开始抽取</button>
              </div>

              <!-- 进度指示器 -->
              <div
                class="progress-indicator"
                id="progressIndicator"
                style="display: none"
              >
                <div class="progress-bar">
                  <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备中...</div>
              </div>

              <!-- 速度档位选择器 -->
              <div class="speed-selector">
                <div class="speed-label">抽奖速度：</div>
                <div class="speed-options">
                  <button class="speed-btn" data-speed="slow" id="speedSlow">
                    慢速
                  </button>
                  <button
                    class="speed-btn active"
                    data-speed="normal"
                    id="speedNormal"
                  >
                    正常
                  </button>
                  <button class="speed-btn" data-speed="fast" id="speedFast">
                    快速
                  </button>
                </div>
              </div>

              <button class="manage-btn" onclick="openManagePage()">
                管理选项
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 组合选择器 -->
      <div class="group-selector" id="groupSelector" style="display: none">
        <div class="selector-content">
          <h3>选择组合</h3>
          <div class="group-list" id="groupList">
            <!-- 组合列表将在这里动态生成 -->
          </div>
          <button class="close-btn" onclick="hideGroupSelector()">关闭</button>
        </div>
      </div>
    </div>

    <!-- 添加数据管理相关的脚本 -->
    <script src="javascript/cookie-manager.js"></script>
    <script src="javascript/data-manager.js"></script>
    <script src="javascript/fireworks.js"></script>
    <script src="javascript/script.js"></script>

    <!-- 抽奖结果浮层 -->
    <div class="result-overlay" id="resultOverlay" style="display: none;">
      <!-- 半透明模糊背景 -->
      <div class="overlay-background"></div>
      
      <!-- 烟花效果容器 -->
      <div class="fireworks-container" id="fireworksContainer"></div>
      
      <!-- 结果展示区域 -->
      <div class="result-showcase">
        <!-- 标题文字 -->
        <div class="result-title">
          <h1>今天小羊吃：</h1>
        </div>
        
        <!-- 结果卡片 -->
        <div class="overlay-result-card" id="overlayResultCard">
          <div class="overlay-result-content">
            <h2 id="overlayResultTitle">加载中...</h2>
            <p id="overlayResultDescription">正在加载数据</p>
          </div>
        </div>
        
        <!-- 关闭按钮 -->
        <button class="close-overlay-btn" onclick="closeResultOverlay()">
          <span>×</span>
        </button>
      </div>
    </div>
  </body>
</html>
