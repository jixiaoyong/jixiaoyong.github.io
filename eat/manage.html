<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理选项 - 今天吃什么？</title>
    <link rel="stylesheet" href="styles/wechat-variables.css">
    <link rel="stylesheet" href="styles/wechat-layout.css">
    <link rel="stylesheet" href="styles/wechat-buttons.css">
    <link rel="stylesheet" href="styles/manage-style.css">
</head>

<body>
    <div class="manage-container">
        <div class="manage-header">
            <h1>管理选项</h1>
            <p>管理您的食物组合和选项</p>
        </div>

        <div class="manage-tabs">
            <button class="tab-btn active" data-tab="groups">组合管理</button>
            <button class="tab-btn" data-tab="history">抽取历史</button>
            <button class="tab-btn" data-tab="data">数据管理</button>
        </div>

        <div id="groupsTab" class="tab-content active">
            <button class="add-group-btn">+ 新建组合</button>
            <div class="group-list-manage" id="groupListManage">
            </div>
        </div>

        <div id="historyTab" class="tab-content">
            <div class="history-list" id="historyList">
            </div>
        </div>

        <div id="dataTab" class="tab-content">
            <div class="data-actions">
                <h3>数据操作</h3>
                <div class="data-buttons">
                    <button class="btn btn-secondary export-btn">导出数据</button>
                    <button class="btn btn-warning import-btn">导入数据</button>
                    <button class="btn btn-danger reset-btn">重置数据</button>
                    <button class="btn btn-ghost back-btn">返回主页</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <div id="groupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">编辑组合</h2>
                <button class="close-modal">&times;</button>
            </div>

            <form id="groupForm">
                <div class="form-group">
                    <label for="groupName">组合名称</label>
                    <input type="text" id="groupName" required>
                </div>

                <div class="form-group">
                    <label>选项列表</label>
                    <div class="items-container" id="itemsContainer">
                    </div>
                    <button type="button" class="btn btn-secondary add-item-btn">+ 添加选项</button>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost cancel-btn">取消</button>
                    <button type="submit" class="btn btn-success save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="javascript/cookie-manager.js"></script>
    <script src="javascript/data-manager.js"></script>
    <script src="javascript/utils.js"></script>
    <script src="javascript/toast-manager.js"></script>
    <script src="javascript/confirm-manager.js"></script>
    <script src="javascript/form-validator.js"></script>

    <script src="javascript/ui-manager.js"></script>
    <script src="javascript/event-manager.js"></script>
    <script src="javascript/manage.js"></script>
    <script>
        // 创建全局实例
        const toastManager = new ToastManager();
        const confirmManager = new ConfirmManager();
    </script>
</body>

</html>
