<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理选项 - 今天吃什么？</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .manage-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .manage-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .manage-header h1 {
            color: var(--text-dark);
            font-size: 2.5em;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        .manage-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            padding: 15px 30px;
            background: none;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            color: var(--text-dark);
        }

        .tab-btn.active {
            border-bottom-color: var(--button-secondary);
            color: var(--button-secondary);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .group-list-manage {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px var(--shadow-light);
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .group-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--shadow-medium);
        }

        .group-card.active {
            border-color: var(--button-secondary);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .group-name {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-dark);
            transition: color 0.3s ease;
        }

        .group-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background: var(--button-secondary);
            color: var(--text-primary);
        }

        .delete-btn {
            background: var(--button-danger);
            color: var(--text-primary);
        }

        .duplicate-btn {
            background: var(--button-success);
            color: var(--text-primary);
        }

        .action-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .item-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .item-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .item-item:last-child {
            border-bottom: none;
        }

        .item-info h4 {
            margin: 0;
            color: var(--text-dark);
            font-size: 1em;
            transition: color 0.3s ease;
        }

        .item-info p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 0.9em;
            transition: color 0.3s ease;
        }

        .add-group-btn {
            background: var(--button-success);
            color: var(--text-primary);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .add-group-btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px var(--shadow-heavy);
            transition: all 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.5em;
            color: var(--text-dark);
            transition: color 0.3s ease;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-dark);
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1em;
            background: var(--card-bg);
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--button-secondary);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .items-container {
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            background: var(--shadow-light);
        }

        .item-form {
            display: flex;
            gap: 10px;
            align-items: end;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--card-bg);
        }

        .add-item-btn {
            background: var(--button-secondary);
            color: var(--text-primary);
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-item-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .remove-item-btn {
            background: var(--button-danger);
            color: var(--text-primary);
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-item-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn {
            background: var(--button-success);
            color: var(--text-primary);
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: var(--button-muted);
            color: var(--text-primary);
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .cancel-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .data-actions {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: var(--shadow-light);
            border-radius: 10px;
        }

        .data-actions h3 {
            margin-bottom: 15px;
            color: var(--text-dark);
            transition: color 0.3s ease;
        }

        .data-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .data-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .export-btn {
            background: var(--button-secondary);
            color: var(--text-primary);
        }

        .import-btn {
            background: var(--button-warning);
            color: var(--text-primary);
        }

        .reset-btn {
            background: var(--button-danger);
            color: var(--text-primary);
        }

        .back-btn {
            background: var(--button-muted);
            color: var(--text-primary);
        }

        .data-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 4px var(--shadow-light);
            transition: all 0.3s ease;
        }

        .history-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px var(--shadow-medium);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-title {
            font-weight: bold;
            color: var(--text-dark);
            transition: color 0.3s ease;
        }

        .history-time {
            color: var(--text-muted);
            font-size: 0.9em;
            transition: color 0.3s ease;
        }

        .history-group {
            color: var(--button-secondary);
            font-size: 0.9em;
        }

        .history-description {
            color: var(--text-muted);
            font-size: 0.9em;
            transition: color 0.3s ease;
        }

        /* 新增样式 */
        .group-info {
            flex: 1;
        }

        .group-meta {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .item-count {
            background: var(--button-secondary);
            color: var(--text-primary);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7em;
        }

        .current-badge {
            background: var(--button-success);
            color: var(--text-primary);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7em;
        }

        .action-btn .icon {
            font-size: 1.2em;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state p {
            font-size: 1.1em;
            margin: 0;
        }

        .item-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
        }

        .item-inputs input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9em;
            background: var(--card-bg);
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .item-inputs input:focus {
            outline: none;
            border-color: var(--button-secondary);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .item-form input.invalid {
            border-color: var(--button-danger);
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.2);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            z-index: 10000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            background: var(--button-success);
        }

        .toast-error {
            background: var(--button-danger);
        }

        .toast-warning {
            background: var(--button-warning);
        }

        .toast-info {
            background: var(--button-secondary);
        }

        .confirm-modal .confirm-content {
            max-width: 400px;
        }

        .confirm-message {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-dark);
            font-size: 1.1em;
        }

        .confirm-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        <blade keyframes|%20spin%20%7B>0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
        }

        .time-ago {
            font-weight: bold;
            color: var(--text-dark);
        }

        .time-full {
            font-size: 0.8em;
            color: var(--text-muted);
        }

        <blade media|%20(max-width%3A%20768px)%20%7B>.manage-container {
            padding: 10px;
        }

        .group-list-manage {
            grid-template-columns: 1fr;
        }

        .item-form {
            flex-direction: column;
            gap: 10px;
        }

        .item-inputs {
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .data-buttons {
            flex-direction: column;
            align-items: center;
        }

        .manage-header h1 {
            font-size: 2em;
        }

        .group-actions {
            flex-direction: column;
            gap: 5px;
        }

        .action-btn {
            padding: 8px 12px;
            font-size: 0.8em;
        }
        }
    </style>
</head>

<body>


    <div class="manage-container">
        <div class="manage-header">
            <h1>管理选项</h1>
            <p>管理您的食物组合和选项</p>
        </div>

        <div class="manage-tabs">
            <button class="tab-btn active" data-tab="groups">组合管理</button>
            <button class="tab-btn" data-tab="history">抽取历史</button>
            <button class="tab-btn" data-tab="data">数据管理</button>
        </div>

        <div id="groupsTab" class="tab-content active">
            <button class="add-group-btn">+ 新建组合</button>
            <div class="group-list-manage" id="groupListManage">
            </div>
        </div>

        <div id="historyTab" class="tab-content">
            <div class="history-list" id="historyList">
            </div>
        </div>

        <div id="dataTab" class="tab-content">
            <div class="data-actions">
                <h3>数据操作</h3>
                <div class="data-buttons">
                    <button class="data-btn export-btn">导出数据</button>
                    <button class="data-btn import-btn">导入数据</button>
                    <button class="data-btn reset-btn">重置数据</button>
                    <button class="data-btn back-btn">返回主页</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <div id="groupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">编辑组合</h2>
                <button class="close-modal">&times;</button>
            </div>

            <form id="groupForm">
                <div class="form-group">
                    <label for="groupName">组合名称</label>
                    <input type="text" id="groupName" required>
                </div>

                <div class="form-group">
                    <label>选项列表</label>
                    <div class="items-container" id="itemsContainer">
                    </div>
                    <button type="button" class="add-item-btn">+ 添加选项</button>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn">取消</button>
                    <button type="submit" class="save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="cookie-manager.js"></script>
    <script src="data-manager.js"></script>
    <script src="utils.js"></script>
    <script src="toast-manager.js"></script>
    <script src="confirm-manager.js"></script>
    <script src="form-validator.js"></script>
    <script src="ui-manager.js"></script>
    <script src="event-manager.js"></script>
    <script src="manage.js"></script>
    <script>
        // 创建全局实例
        const toastManager = new ToastManager();
        const confirmManager = new ConfirmManager();
    </script>
</body>

</html>
