    <style>
        :root {
            /* Light theme variables */
            --bg-primary: #f1f5f9;
            --bg-secondary: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-primary: #3b82f6;
            --accent-secondary: #1d4ed8;
            --border-color: rgba(203, 213, 225, 0.5);
            --shadow-light: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-heavy: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --gradient-secondary: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            --bg-gradient: linear-gradient(135deg,
                    #e0f2fe 0%,
                    #dbeafe 20%,
                    #e0e7ff 40%,
                    #f0f9ff 60%,
                    #e0f2fe 80%,
                    #dbeafe 100%);
        }

        [data-theme="dark"] {
            /* Dark theme variables - using near-black colors without purple */
            --bg-primary: #0a0a0a;
            --bg-secondary: #171717;
            --text-primary: #f8fafc;
            --text-secondary: #a1a1aa;
            --accent-primary: #60a5fa;
            --accent-secondary: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.2);
            --shadow-light: 0 1px 3px 0 rgba(0, 0, 0, 0.5), 0 1px 2px 0 rgba(0, 0, 0, 0.4);
            --shadow-medium: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-heavy: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            --gradient-primary: linear-gradient(135deg, #1e3a8a 0%, #1e293b 100%);
            --gradient-secondary: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --bg-gradient: linear-gradient(135deg,
                    #0f172a 0%,
                    #020617 50%,
                    #0f172a 100%);
        }

        /* Keyframe animation for gradient shift */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 100% 100%;
            }

            75% {
                background-position: 0% 100%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Background and layout styles */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-gradient);
            background-attachment: fixed;
            background-size: 400% 400%;
            background-position: 0% 50%;
            transition: all 0.5s ease;
            padding-bottom: 2rem;
            overflow-x: hidden;
            animation: gradientShift 20s ease infinite;
        }

        [data-theme="dark"] body {
            animation: gradientShift 15s ease infinite;
            background: var(--bg-gradient);
            background-attachment: fixed;
            background-size: 200% 200%;
            background-position: center;
            min-height: 100vh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            position: relative;
            width: 100%;
            height: 100vh;
            transition: all 0.5s ease;
            overflow: hidden;
        }

        [data-theme="dark"] .container {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e1a3d, #020239a4, #1a1033, #0f172a);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%),
                    rgba(255, 255, 255, 0.05) 0%,
                    rgba(255, 255, 255, 0) 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .container:hover::before {
            opacity: 1;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 100% 100%;
            }

            75% {
                background-position: 0% 100%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        .theme-toggle-container {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
            padding: 0.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            opacity: 0.7;
            fill: currentColor;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            opacity: 1;
            transform: translateX(-2px);
        }

        .theme-toggle.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            opacity: 1;
            color: var(--text-primary);
        }

        /* Ensure dark mode button has good contrast in light theme */
        [data-theme="light"] .theme-toggle[data-theme="dark"] {
            color: #333;
        }

        .theme-toggle i {
            font-size: 1rem;
            width: 1.2rem;
            text-align: center;
        }

        .card {
            text-align: center;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
            overflow: hidden;
        }

        [data-theme="light"] .card {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        /* 添加光晕效果 */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            opacity: 0.6;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .card:hover::before {
            opacity: 0.8;
        }

        [data-theme="dark"] .card {
            background: rgba(20, 20, 20, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] .card::before {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .avatar:hover,
        .avatar:focus {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), 0 0 0 2px rgba(255, 255, 255, 0.8);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0.5rem 0 1.5rem;
            position: relative;
            text-align: center;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.1em;
        }

        .char {
            display: inline-block;
            position: relative;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.7);
            text-stroke: 1px rgba(255, 255, 255, 0.7);
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.9) 0%,
                    rgba(255, 255, 255, 0.6) 50%,
                    rgba(255, 255, 255, 0.9) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-fill-color: transparent;
            filter:
                drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3)) drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
        }

        .char::before {
            content: attr(data-char);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: rgba(255, 255, 255, 0.1);
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
            text-stroke: 1px rgba(255, 255, 255, 0.3);
            z-index: -1;
            filter: blur(1px);
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .nav-link i {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            transition: transform 0.3s ease;
        }

        .nav-link span {
            font-size: 0.7rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .nav-link:active {
            transform: translateY(1px);
        }

        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 2rem;
            padding: 1rem 0;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--accent-primary);
            text-decoration: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {

            .card {
                margin: 1rem;
            }


            .name {
                font-size: 2rem;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
                margin: 0 auto 2rem;
                gap: 1rem;
            }

            .nav-link {
                width: 100%;
                height: auto;
                border-radius: 12px;
                padding: 0.75rem 1rem;
                flex-direction: row;
                justify-content: flex-start;
                gap: 1rem;
            }

            .nav-link i {
                margin-bottom: 0;
                font-size: 1.2rem;
            }

            .nav-link span {
                font-size: 0.9rem;
            }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .theme-toggle-container {
            top: 1rem;
            right: 1rem;
            padding: 0.25rem;
            border-radius: 1.25rem;
        }

        .theme-toggle {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        .theme-toggle i {
            font-size: 0.9rem;
        }

        .name {
            font-size: 1.75rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
        }

        /* Loading animation */
        .loading {
            opacity: 0;
            animation: fadeIn 1s ease-in-out forwards;
        }



        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

    <script>
        // 鼠标移动光晕效果 - 更淡的白色光晕
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const {
                clientX,
                clientY
            } = e;
            const {
                left,
                top
            } = container.getBoundingClientRect();

            // 计算鼠标在容器内的相对位置
            const x = clientX - left;
            const y = clientY - top;

            // 更新 CSS 变量
            container.style.setProperty('--x', `${x}px`);
            container.style.setProperty('--y', `${y}px`);

            // 创建光晕元素
            const glow = document.createElement('div');
            glow.className = 'glow';
            glow.style.left = `${x}px`;
            glow.style.top = `${y}px`;

            // 设置光晕样式 - 使用非常淡的白色
            Object.assign(glow.style, {
                position: 'absolute',
                width: '0',
                height: '0',
                borderRadius: '50%',
                background: 'radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%)',
                transform: 'translate(-50%, -50%)',
                pointerEvents: 'none',
                zIndex: '0',
                transition: 'width 2s ease-out, height 2s ease-out, opacity 2s ease-out',
                opacity: '0.3',
                filter: 'blur(5px)'
            });

            // 添加到容器
            container.appendChild(glow);

            // 触发重绘
            void glow.offsetWidth;

            // 动画 - 更缓慢的扩散
            Object.assign(glow.style, {
                width: '300px',
                height: '300px',
                opacity: '0'
            });

            // 动画结束后移除元素
            setTimeout(() => {
                if (glow.parentNode === container) {
                    container.removeChild(glow);
                }
            }, 2000);
        });

        // 卡片悬停效果
        const card = document.querySelector('.card');
        if (card) {
            card.addEventListener('mousemove', (e) => {
                const {
                    left,
                    top,
                    width,
                    height
                } = card.getBoundingClientRect();
                const x = (e.clientX - left) / width - 0.5;
                const y = (e.clientY - top) / height - 0.5;

                card.style.transform = `perspective(1000px) rotateX(${y * 5}deg) rotateY(${-x * 5}deg)`;
                card.style.boxShadow = `${-x * 20}px ${y * 20}px 30px rgba(0, 0, 0, 0.2)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
                card.style.boxShadow = '0 8px 32px 0 rgba(31, 38, 135, 0.1)';
                if (document.documentElement.getAttribute('data-theme') === 'dark') {
                    card.style.boxShadow = '0 8px 32px 0 rgba(0, 0, 0, 0.3)';
                }
            });
        }

        // Theme switching functionality
        const themeToggles = document.querySelectorAll('.theme-toggle');
        const html = document.documentElement;
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        // Get saved theme preference or default to 'system'
        let currentTheme = localStorage.getItem('theme') || 'system';

        // Apply theme
        function applyTheme(theme) {
            // Remove all theme classes
            html.removeAttribute('data-theme');

            // Apply selected theme
            if (theme === 'system') {
                // Remove local storage to use system preference
                localStorage.removeItem('theme');
                // Set theme based on system preference
                const systemTheme = prefersDark.matches ? 'dark' : 'light';
                html.setAttribute('data-theme', systemTheme);
            } else {
                // Apply selected theme
                html.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            }

            // Update active state of buttons
            themeToggles.forEach(toggle => {
                if (toggle.dataset.theme === theme) {
                    toggle.classList.add('active');
                } else {
                    toggle.classList.remove('active');
                }
            });

            currentTheme = theme;
        }

        // Initialize theme
        applyTheme(currentTheme);

        // Theme toggle click handler
        themeToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const theme = toggle.dataset.theme;
                applyTheme(theme);
            });
        });

        // Listen for system theme changes
        prefersDark.addEventListener('change', (e) => {
            if (currentTheme === 'system') {
                const systemTheme = e.matches ? 'dark' : 'light';
                html.setAttribute('data-theme', systemTheme);
            }
        });

        // Remove loading class after page loads
        window.addEventListener('load', () => {
            document.body.classList.remove('loading');
        });

        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', () => {
            // Add hover effects to avatar
            const avatar = document.querySelector('.avatar');
            avatar.addEventListener('mouseenter', () => {
                avatar.style.transform = 'scale(1.05) rotate(5deg)';
            });
            avatar.addEventListener('mouseleave', () => {
                avatar.style.transform = 'scale(1) rotate(0deg)';
            });

            // Add click effect to nav links
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    // Create ripple effect
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;

                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('ripple');

                    this.appendChild(ripple);

                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });
        });
    </script>
