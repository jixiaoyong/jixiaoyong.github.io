<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HubEditor - 跳转中...</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* 亮色主题 */
      body.light {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #2c3e50;
      }

      /* 暗色主题 */
      body.dark {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #e0e0e0;
      }

      .loading-container {
        text-align: center;
        padding: 2rem;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.18);
        min-width: 300px;
      }

      .spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 1.5rem;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-size: 1.25rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 0.5rem;
        animation: pulse 2s ease-in-out infinite;
      }

      .loading-subtext {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 400;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
    </style>
    <script>
      // 检测系统主题偏好
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      document.body.classList.add(prefersDark ? "dark" : "light");

      // 检测浏览器语言
      const lang = navigator.language || navigator.userLanguage;
      const isChinese = lang.startsWith("zh");

      // 设置文本内容
      const messages = {
        zh: {
          title: "页面跳转中...",
          subtitle: "正在为您加载编辑器",
        },
        en: {
          title: "Redirecting...",
          subtitle: "Loading HubEditor",
        },
      };

      const text = isChinese ? messages.zh : messages.en;

      // GitHub Pages SPA 重定向解决方案 (for BrowserRouter)
      // 当用户直接访问一个路由（如 /editor/callback）时，GitHub Pages 会返回 404
      // 这个脚本会将路径信息保存到 sessionStorage，然后重定向到 index.html
      // index.html 中的脚本会读取 sessionStorage 并恢复原始路径

      // 获取完整路径
      let fullPath = location.pathname;

      // 提取基础路径后的部分（/editor/callback -> /callback）
      const baseUrl = "/editor"; // 固定基础路径
      const routePath = fullPath.replace(baseUrl, ""); // 获取 /callback 或 /dashboard

      // 保存完整路径到 sessionStorage（包含 query 参数和 hash）
      const redirectPath =
        routePath + (location.search || "") + (location.hash || "");
      if (redirectPath && redirectPath !== "/") {
        sessionStorage.setItem("redirect", redirectPath);
      }

      // 重定向到 index.html（基础路径）
      location.replace(baseUrl + "/");
    </script>
  </head>
  <body>
    <div class="loading-container">
      <div class="spinner"></div>
      <div class="loading-text" id="title">Redirecting...</div>
      <div class="loading-subtext" id="subtitle">Loading HubEditor</div>
    </div>
    <script>
      // 动态设置文本（在页面加载后）
      document.getElementById("title").textContent = text.title;
      document.getElementById("subtitle").textContent = text.subtitle;
    </script>
  </body>
</html>
