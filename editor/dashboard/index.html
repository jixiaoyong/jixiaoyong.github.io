<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/editor/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Editor</title>
    
    <!-- 预连接 GitHub API 域名，加速首次请求 -->
    <link rel="dns-prefetch" href="https://api.github.com" />
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="preconnect" href="https://github.com" crossorigin />
    
    <!-- 主题色，防止白屏闪烁 -->
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    
    <!-- 内联脚本：提前设置暗色模式，避免闪烁 -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <script type="module" crossorigin src="/editor/assets/index-BDSGKD6p.js"></script>
    <link rel="modulepreload" crossorigin href="/editor/assets/highlight-D7qElfpT.js">
    <link rel="modulepreload" crossorigin href="/editor/assets/react-vendor-De436sE3.js">
    <link rel="stylesheet" crossorigin href="/editor/assets/index-nI7TQvw8.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
